name: _diag-linux-freeze
# TEMPORAL / diagnóstico (gate PRE-PHASE-2 de reproducibilidad).
# Objetivo: capturar la resolución fresca de dependencias en Linux + Python 3.14.3
# (el target real de CI/DigitalOcean) para reconciliarla con el freeze Windows y
# proponer un constraints.txt cross-platform.
# NO es tooling permanente: se BORRA una vez capturado y validado el freeze.
# No toca la app, requirements, ci.yml ni constraints.

on:
  push:
    branches:
      - work/architecture-phase-2

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: Environment
        run: |
          echo "OS: $RUNNER_OS"
          uname -a
          python --version
          python -m pip --version

      - name: Fresh install (SIN constraints)
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Pip freeze
        run: |
          python -m pip freeze > linux-freeze.txt
          echo "===== BEGIN LINUX PIP FREEZE ====="
          cat linux-freeze.txt
          echo "===== END LINUX PIP FREEZE ====="

      - name: Upload freeze artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-freeze
          path: linux-freeze.txt

      - name: Tests baseline
        run: |
          python -m pytest tests/test_route_contract.py -q
          python -m pytest -q
