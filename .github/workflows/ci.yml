name: CI

# Red de regresión mínima para el refactor arquitectónico (Fase 0).
# Solo corre la suite de pytest; sin linting/coverage/security/build/matrices.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04      # fijo: Python 3.14.3 (.python-version) no existe para Ubuntu 26.04 en actions/python-versions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
