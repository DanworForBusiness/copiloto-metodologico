name: CI

# Red de regresión mínima para el refactor arquitectónico (Fase 0).
# Solo corre la suite de pytest; sin linting/coverage/security/build/matrices.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04      # fijo: Python 3.14.3 (.python-version) no existe para Ubuntu 26.04 en actions/python-versions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Gate Linux de la extracción de conexiones (F2.1 · G7): CLI de Datasphere EXACTO del lockfile + tenant FALSO en
      # 127.0.0.1. Sin credenciales, sin SAP, sin variables nuevas. Un fallo (exit != 0) corta el job: nunca pasa por SKIP.
      - name: Set up Node 22 (engines de package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Datasphere CLI from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Connectivity Linux gate (G7)
        run: python -m tools.catalog.connectivity_governance.linux_gate

      - name: Run tests
        run: pytest -q
