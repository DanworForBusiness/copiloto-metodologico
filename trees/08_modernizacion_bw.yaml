id: m08_modernizacion_bw
title: Alcance de Modernización BW
version: "0.1"

# Links como navigation bindings (para UI / conexión con módulos)
links:
  module: 08_Modernizacion_BW_Greenfield_BDC
  topics: ["greenfield", "alcance"]

# Tags taxonomy / Concepts (para búsqueda, agrupación, KG futuro)
tags: ["M08", "modernization", "bw", "greenfield"]

# Keywords en lenguaje natural para intent detection del asistente.
keywords: [
  "modernización BW", "modernizacion BW", "migrar BW", "migración BW",
  "BW a Datasphere", "BW datasphere", "qué hacer con objeto BW",
  "objeto BW crítico", "objeto BW uso", "decomisisar BW",
  "rediseñar BW", "canonizar BW", "armonizar BW",
  "extractor BW soportado", "extractor soportado datasphere",
  "lógica negocio core SAP BW", "logica negocio core",
  "árbol modernización", "arbol modernizacion",
  "árbol BW datasphere", "arbol BW datasphere",
  "decidir qué modernizar", "decidir que modernizar",
  "objeto critico BW", "objeto obsoleto BW",
  "whitelisted BW", "extractor ODP BW", "extractor CDS BW",
  "clean core modernización", "clean core migracion"
]

# exclude_if: palabras de intención operacional
exclude_if: [
  "codigo", "código", "template", "ejemplo", "ayudame con el codigo",
  "como hago", "como escribo", "escribir", "generar codigo", "crearme",
  "dame un", "mostrame", "sample", "snippet"
]

start: q1

nodes:
  q1:
    type: single_choice
    question: "¿El objeto BW tiene uso real y es crítico para el negocio (métricas de ejecución + validación con el área)?"
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": q2_extractor
      "No": leaf_decomisionar
      "No sé": leaf_relevar

  q2_extractor:
    type: single_choice
    question: "¿El extractor o fuente de datos está soportado para integración con Datasphere (ODP-SAPI whitelisted o CDS disponible)?"
    options: ["Sí", "No"]
    next:
      "Sí": q3_logica
      "No": q4_cds_alternativa

  q3_logica:
    type: single_choice
    question: "¿La lógica de negocio o transformación reside en el core SAP (rutinas de transformación, exits, cálculos en BW)?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_migrar_logica
      "No": leaf_canonizar

  q4_cds_alternativa:
    type: single_choice
    question: "¿Existe un extractor CDS estándar que cubra la necesidad del objeto BW?"
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": q5_cds_compat
      "No": leaf_cds_custom
      "No sé": leaf_gap_extractor

  q5_cds_compat:
    type: single_choice
    question: "¿La CDS estándar cuenta con las anotaciones compatibles con Datasphere (@Analytics.dataExtraction)?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_canonizar
      "No": leaf_cds_copiar

leaves:
  leaf_decomisionar:
    decision: "Candidato a baja — el objeto no tiene uso real ni criticidad de negocio que justifique su modernización."
    notes:
      - "Documentar en la matriz técnica como candidato a decomisión."
      - "Validar con el área de negocio antes de confirmar la baja (puede ser crítico por cierre o regulación)."
      - "Principio: menos es más — solo lo que agrega valor se moderniza."
    post_actions:
      mode: resolved
      next_steps:
        - "Registrar en la matriz técnica con indicador 'candidato a baja'"
        - "Validar con el responsable de negocio antes de confirmar"

  leaf_relevar:
    decision: "Relevamiento pendiente — sin métricas de uso no es posible determinar criticidad ni alcance."
    notes:
      - "Recopilar métricas de ejecución de los últimos 90 días."
      - "Validar con el área de negocio si el objeto es referenciado en procesos regulatorios o de cierre."
    post_actions:
      mode: needs_human_review
      reason: "Sin datos de uso — completar la matriz técnica antes de decidir el alcance de modernización"

  leaf_canonizar:
    decision: "Modernizar vía canonización — el extractor está soportado y la lógica es limpia. Armonizar el modelo en Datasphere con entidad canónica."
    notes:
      - "Si integra solo fuentes SAP: usar el diccionario SAP como referencia y armonizar según convención corporativa."
      - "Si integra múltiples fuentes: crear nueva Entidad Canónica bajo convención corporativa unificada."
      - "Eliminar prefijos Z/Y — normalizar al idioma canónico del cliente."
    post_actions:
      mode: llm_value_add

  leaf_migrar_logica:
    decision: "Modernizar con migración de lógica — mover la transformación del core SAP a Datasphere, manteniendo clean core en SAP."
    notes:
      - "La lógica de negocio y los cálculos complejos deben residir en Datasphere (capas de armonización/propagación)."
      - "Ver Principio Clean Core (módulo 03) para validar qué puede mantenerse en SAP y qué debe migrarse."
      - "Documentar la deuda técnica y la lógica migrada."
    post_actions:
      mode: llm_value_add

  leaf_cds_custom:
    decision: "Crear CDS custom usando el template Danwor — no existe extractor estándar soportado para este objeto."
    notes:
      - "Usar el template ZCDS_DWC_DIM_TEMPLATE como base."
      - "Incluir las anotaciones mínimas: @Analytics.dataExtraction.enabled: true, @Analytics.dataCategory."
      - "Documentar el gap: por qué no existe extractor estándar."
    post_actions:
      mode: llm_value_add

  leaf_cds_copiar:
    decision: "Copiar CDS estándar y adaptar anotaciones — la CDS existe pero no tiene compatibilidad completa con Datasphere."
    notes:
      - "Copiar la CDS estándar como vista Z y agregar las anotaciones requeridas."
      - "Revisar @Analytics.dataExtraction.enabled y @Analytics.dataCategory."
      - "Ver módulo 03 para referencia de anotaciones mínimas compatibles."
    post_actions:
      mode: llm_value_add

  leaf_gap_extractor:
    decision: "Gap analysis de extractor — sin claridad sobre disponibilidad de CDS estándar, investigar antes de comprometer el enfoque."
    notes:
      - "Revisar el SAP Business Accelerator Hub para CDS disponibles para el objeto de negocio."
      - "Si no existe CDS estándar → CDS custom con template Danwor."
      - "Validar whitelist ODP-SAPI (Nota SAP 2500202) como alternativa."
    post_actions:
      mode: needs_human_review
      reason: "Disponibilidad de CDS estándar desconocida — revisar Business Accelerator Hub antes de definir el enfoque de extracción"

capture_uncharted:
  type: free_capture
  prompt: "Describí brevemente el objeto BW y su contexto"
  fields:
    - id: context_description
      label: "¿Qué objeto BW estás evaluando y cuál es su caso de uso?"
      required: true
    - id: decision_taken
      label: "¿Qué alcance de modernización decidiste?"
      required: false
    - id: outcome
      label: "¿Cómo resultó?"
      type: select
      options: ["anduvo", "no anduvo", "inconcluso", "en curso", "no lo sé"]
      required: true
