id: m04_tipos_vistas_sql
title: Tipos de Vistas SQL
version: "0.1"

# Links como navigation bindings (para UI / conexión con módulos)
links:
  module: 04_Modelado_y_Desarrollo
  topics: ["vistas_sql", "capas"]

# Tags taxonomy / Concepts (para búsqueda, agrupación, KG futuro)
tags: ["M04", "modeling", "sql", "views", "development"]

# Keywords en lenguaje natural para intent detection del asistente.
# Responde: ¿Cómo preguntaría un consultor sobre este árbol?
keywords: [
  "tipos vistas SQL", "vista estándar", "vista grafica", "vista gráfica",
  "table function", "SQLScript", "data flow", "replication flow",
  "qué tipo de vista usar", "que tipo de vista usar",
  "cuándo usar vista gráfica", "cuando usar vista grafica",
  "cuándo usar SQLScript", "cuando usar SQLScript",
  "cuándo usar data flow", "cuando usar data flow",
  "vista SQL datasphere", "vistas datasphere", "crear vista datasphere",
  "tipo vista datasphere", "SQL standard view", "graphical view",
  "table function datasphere", "vista calculada",
  "árbol vistas SQL", "arbol vistas SQL",
  "qué vista elegir", "que vista elegir",
  "pasos secuenciales datasphere", "lógica condicional SQL", "logica condicional SQL",
  "librerías SQLScript", "librerias SQLScript", "persistencia vista",
  "snapshot datasphere", "replication flow vs data flow"
]

# exclude_if: palabras de intención operacional (el usuario quiere HACER algo, no DECIDIR)
exclude_if: [
  "codigo", "código", "template", "ejemplo", "ayudame con el codigo",
  "como hago", "como escribo", "escribir", "generar codigo", "crearme",
  "dame un", "mostrame", "sample", "snippet"
]

start: q1

nodes:
  q1:
    type: single_choice
    question: "¿El objetivo se puede resolver con una consulta SQL convencional (SELECT, filtros, JOINs, agregaciones)?"
    options: ["Sí", "No"]
    next:
      "Sí": q2_visual
      "No": q3_pasos

  q2_visual:
    type: single_choice
    question: "¿El caso es un prototipo o se beneficia de un modelo visual drag-and-drop para que otros lo entiendan sin escribir SQL?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_grafica
      "No": leaf_standard

  q3_pasos:
    type: single_choice
    question: "¿Se necesita lógica con pasos secuenciales (cada paso usa el resultado del anterior) o columnas/tablas dinámicas en tiempo de ejecución?"
    options: ["Sí", "No"]
    next:
      "Sí": q4_script
      "No": q5_persistencia

  q4_script:
    type: single_choice
    question: "¿Se requieren librerías o funciones especiales solo disponibles vía SQLScript (operadores avanzados, lógica de control de flujo)?"
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": leaf_table_function
      "No": leaf_table_function_simple
      "No sé": leaf_table_function

  q5_persistencia:
    type: single_choice
    question: "¿Se requiere snapshot, persistencia de datos o particionar los resultados por rendimiento y reuso?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_data_flow
      "No": leaf_standard

leaves:
  leaf_standard:
    decision: "Vista SQL Estándar — opción recomendada para ~80% de los casos en Datasphere."
    notes:
      - "Cubre filtros, JOINs, agregaciones, cálculos y expresiones CASE."
      - "Mejor plan de ejecución HANA, más fácil de versionar, trazar y auditar."
      - "Preferir siempre sobre Vista Gráfica en objetos productivos o reutilizables."
    post_actions:
      mode: resolved
      next_steps:
        - "Crear la vista en la capa correspondiente (1=Ingesta, 2=Armonización, 3=Consumo)"
        - "Aplicar el naming convention: <Capa><Tipo>_<Origen>_<Libre>"
        - "Definir el tipo semántico (Relacional, Dimension, Fact, Analytical Dataset)"

  leaf_grafica:
    decision: "Vista Gráfica — aceptable para prototipos o exploración inicial. No usar en modelos productivos."
    notes:
      - "El plan de ejecución HANA es menos optimizable que en SQL Estándar."
      - "Dificulta el versionado, la trazabilidad y la auditoría técnica."
      - "Escala peor en modelos reutilizables o críticos."
      - "Planificar migración a Vista SQL Estándar antes de promover a producción."
    post_actions:
      mode: llm_value_add

  leaf_table_function:
    decision: "Table Function (SQLScript) — para lógica con pasos secuenciales o librerías especiales no disponibles en SQL Estándar."
    notes:
      - "Incluir siempre una vista wrapper de consumo sobre la Table Function para preservar el linaje de datos."
      - "Documentar por qué SQL Estándar no fue suficiente (justificación técnica)."
      - "Representa ≤5% de los artefactos en un proyecto sano."
    post_actions:
      mode: llm_value_add

  leaf_table_function_simple:
    decision: "Evaluar si SQL Estándar resuelve el caso — la lógica secuencial puede ser innecesaria. Si no, usar Table Function con wrapper."
    notes:
      - "Antes de comprometerse con SQLScript, verificar si una CTE (Common Table Expression) en SQL Estándar cubre el caso."
      - "Si se confirma Table Function: incluir vista wrapper para preservar linaje."
    post_actions:
      mode: needs_human_review
      reason: "Verificar si SQL Estándar con CTEs cubre el caso antes de implementar Table Function"

  leaf_data_flow:
    decision: "Data Flow — para persistencia, snapshots o transformaciones pesadas que no deben ejecutarse en cada consulta."
    notes:
      - "No es una vista en tiempo real — es un proceso de carga que genera una tabla local."
      - "Definir la frecuencia de actualización (schedule) y el impacto en el sistema fuente."
      - "Evaluar Replication Flow si el caso es replicación incremental desde sistemas SAP."
    post_actions:
      mode: llm_value_add

capture_uncharted:
  type: free_capture
  prompt: "Describí brevemente tu caso de modelado"
  fields:
    - id: context_description
      label: "¿Qué necesitás resolver con la vista?"
      required: true
    - id: decision_taken
      label: "¿Qué tipo de vista elegiste?"
      required: false
    - id: outcome
      label: "¿Cómo resultó?"
      type: select
      options: ["anduvo", "no anduvo", "inconcluso", "en curso", "no lo sé"]
      required: true
