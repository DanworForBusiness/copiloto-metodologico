id: m03_clean_core_guardrails
title: Guardrails Clean Core
version: "0.2"

# Links como navigation bindings (para UI / conexión con módulos)
links:
  module: 03_Integracion_y_Estrategia_de_Datos
  topics: ["extraccion", "gobernanza"]

# Tags taxonomy / Concepts (para búsqueda, agrupación, KG futuro)
# concepts responde: ¿De qué trata este árbol?
tags: ["M03", "governance", "integration", "clean-core"]

# Keywords en lenguaje natural para intent detection del asistente.
# Responde: ¿Cómo preguntaría un consultor sobre este árbol?
keywords: [
  "clean core", "guardrail", "guardrails",
  "lógica de negocio", "logica de negocio", "logica en el core",
  "custom abap", "modificación core", "modificacion core",
  "puedo modificar", "debo hacer custom", "es válido un exit",
  "exit de extracción", "custom en core", "deuda técnica",
  "wrapper", "side by side", "patrón wrapper",
  "CDS", "Vista CDS", "CDS View", "CDS Estandar", "VDM",
  "Metadata", "Metadatos", "Semantics", "semantica",
  "interfaces liberadas", "released interfaces",
  "upgrade compatible", "impacto upgrade"
]

# exclude_if: palabras que indican intención de HACER algo (código/template),
# no de DECIDIR algo (que es para lo que sirve este árbol).
# NOTA: "que es" fue removido — preguntas conceptuales como "¿qué es un guardrail?"
# son válidas para llegar al árbol y ser guiadas hacia la decisión correcta.
exclude_if: [
  "codigo", "template", "ejemplo", "ayudame con el codigo",
  "como hago", "como escribo", "escribir", "generar codigo", "crearme",
  "dame un", "mostrame", "sample", "snippet"
]

start: q1

nodes:
  q1:
    type: single_choice
    question: "¿La solución propone lógica de negocio en el core (ABAP/Extractor custom) para reporting?"
    options: ["Sí", "No"]
    next:
      "Sí": q2_pressure
      "No": q3_std

  q2_pressure:
    type: single_choice
    question: "¿La razón principal es presión de tiempo (go-live) o falta de extractor estándar?"
    options: ["Presión de tiempo", "Falta estándar"]
    next:
      "Presión de tiempo": leaf_refactor_plan
      "Falta estándar": leaf_released_interfaces

  q3_std:
    type: single_choice
    question: "¿Existen interfaces liberadas (CDS/ODP/API) para el caso?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_prefer_released
      "No": leaf_gap_analysis

leaves:
  leaf_refactor_plan:
    decision: "Aceptar workaround mínimo y planificar refactor inmediato para volver a clean core."
    notes:
      - "Definir deuda técnica explícita y fecha de remediación."
    post_actions:
      mode: llm_value_add

  leaf_released_interfaces:
    decision: "Evitar custom en core: diseñar extracción vía interfaces liberadas (o patrón wrapper) alineado al marco."
    notes:
      - "Documentar gap y justificación; validar impacto futuro (upgrade)."
    post_actions:
      mode: llm_value_add

  leaf_prefer_released:
    decision: "Usar interfaces liberadas como primera opción (clean core)."
    notes:
      - "Reducir acoplamiento y facilitar upgrades."
    post_actions:
      mode: resolved
      next_steps:
        - "Identificar CDS/ODP disponible para el caso"
        - "Validar anotaciones de compatibilidad con Datasphere"

  leaf_gap_analysis:
    decision: "Hacer gap analysis: si no hay interfaz liberada, definir patrón compatible (wrapper/side-by-side) y gobernanza."
    notes:
      - "No inventar lógica en core sin control; revisar anti-patterns."
    post_actions:
      mode: llm_value_add

capture_uncharted:
  type: free_capture
  prompt: "Describí brevemente tu contexto técnico"
  fields:
    - id: context_description
      label: "¿Qué caracteriza tu caso?"
      required: true
    - id: decision_taken
      label: "¿Qué decidiste hacer?"
      required: false
    - id: outcome
      label: "¿Cómo resultó?"
      type: select
      options: ["anduvo", "no anduvo", "inconcluso", "en curso", "no lo sé"]
      required: true