id: m05_herramienta_reporting
title: Herramienta de Reporting
version: "0.1"

# Links como navigation bindings (para UI / conexión con módulos)
links:
  module: 05_Reporting_y_Consumo
  topics: ["herramientas", "conexion"]

# Tags taxonomy / Concepts (para búsqueda, agrupación, KG futuro)
tags: ["M05", "reporting", "consumption", "tools"]

# Keywords en lenguaje natural para intent detection del asistente.
keywords: [
  "herramienta reporting", "herramienta BI", "herramienta análisis",
  "SAC", "SAP Analytics Cloud", "Power BI", "BusinessObjects", "BO",
  "qué herramienta usar", "que herramienta usar",
  "SAC vs Power BI", "Power BI vs SAC", "cuando usar SAC", "cuando usar Power BI",
  "cómo conectar Power BI", "como conectar Power BI",
  "DirectQuery datasphere", "Import Mode datasphere",
  "Live Data Connection", "live connection SAC",
  "herramienta externa datasphere", "consumo externo datasphere",
  "visualización datasphere", "reporting datasphere",
  "schema user Power BI", "conexión Power BI datasphere",
  "qué usar para reportes", "que usar para reportes",
  "herramienta reporte SAP", "cliente Power BI", "cliente SAC"
]

# exclude_if: palabras de intención operacional
exclude_if: [
  "codigo", "código", "template", "ejemplo", "ayudame con el codigo",
  "como hago", "como escribo", "escribir", "generar codigo", "crearme",
  "dame un", "mostrame", "sample", "snippet"
]

start: q1

nodes:
  q1:
    type: single_choice
    question: "¿El cliente ya tiene una herramienta de BI definida o en uso (Power BI, SAC, BO)?"
    options: ["Sí, Power BI", "Sí, SAC", "Sí, BusinessObjects", "No / No sé"]
    next:
      "Sí, Power BI": q2_pbi_modo
      "Sí, SAC": leaf_sac
      "Sí, BusinessObjects": leaf_bo
      "No / No sé": q3_ecosistema

  q2_pbi_modo:
    type: single_choice
    question: "¿Los reportes requieren datos en tiempo real o es aceptable actualización programada (batch)?"
    options: ["Tiempo real", "Batch / programado", "No sé"]
    next:
      "Tiempo real": leaf_pbi_directquery
      "Batch / programado": leaf_pbi_import
      "No sé": leaf_pbi_revisar

  q3_ecosistema:
    type: single_choice
    question: "¿El cliente tiene licencias SAP (SAC, BTP) o prioriza el ecosistema Microsoft?"
    options: ["Ecosistema SAP", "Ecosistema Microsoft", "Indiferente / Mixto"]
    next:
      "Ecosistema SAP": leaf_sac
      "Ecosistema Microsoft": leaf_pbi_directquery
      "Indiferente / Mixto": leaf_revision

leaves:
  leaf_sac:
    decision: "SAP Analytics Cloud (SAC) — integración nativa con Datasphere vía Live Data Connection."
    notes:
      - "No requiere schema users ni configuración adicional de conectividad."
      - "Consume modelos analíticos en tiempo real y respeta DAC automáticamente."
      - "Opción recomendada dentro del ecosistema SAP end-to-end."
    post_actions:
      mode: resolved
      next_steps:
        - "Verificar licencias SAC disponibles en el tenant del cliente"
        - "Configurar la Live Data Connection desde SAC hacia el espacio Datasphere"
        - "Asegurar que las vistas de consumo (capa 3) tienen el Semantic Usage correcto (Analytical Dataset)"

  leaf_pbi_directquery:
    decision: "Power BI con DirectQuery — datos en tiempo real consultando Datasphere en cada interacción."
    notes:
      - "Requiere schema user a nivel espacio con los DAC correspondientes."
      - "Impacto de performance en Datasphere con consultas concurrentes — evaluar workload class."
      - "Garantiza datos siempre actualizados sin necesidad de refresh schedule."
    post_actions:
      mode: llm_value_add

  leaf_pbi_import:
    decision: "Power BI con Import Mode — datos importados y almacenados en el motor de Power BI."
    notes:
      - "Requiere schema user a nivel espacio."
      - "Performance óptima en Power BI — no impacta Datasphere en cada consulta."
      - "Definir frecuencia de refresh según SLA de actualización del negocio."
    post_actions:
      mode: llm_value_add

  leaf_pbi_revisar:
    decision: "Power BI confirmado — evaluar modo de conexión (DirectQuery vs Import) según SLA de datos del cliente."
    notes:
      - "DirectQuery si se necesitan datos en tiempo real o casi real."
      - "Import Mode si la actualización cada hora/día es suficiente y se prioriza performance."
    post_actions:
      mode: needs_human_review
      reason: "SLA de actualización de datos no definido — levantar con el cliente antes de configurar el modo de conexión"

  leaf_bo:
    decision: "BusinessObjects (BO) — vía Universe o conexión JDBC/ODBC hacia Datasphere."
    notes:
      - "Opción para clientes con BO existente que no migran aún a SAC."
      - "Requiere schema user a nivel espacio."
      - "Evaluar roadmap de migración a SAC a mediano plazo si el cliente sigue en ecosistema SAP."
    post_actions:
      mode: llm_value_add

  leaf_revision:
    decision: "Revisión recomendada: definir la herramienta antes de configurar la capa de consumo."
    notes:
      - "La elección de herramienta impacta en el tipo semántico y la estructura de las vistas de consumo."
      - "Proponer SAC si el cliente no tiene preferencia — es la integración más directa."
    post_actions:
      mode: needs_human_review
      reason: "Herramienta de reporting no definida — alinear con el cliente antes de diseñar la capa de consumo"

capture_uncharted:
  type: free_capture
  prompt: "Describí brevemente tu contexto de reporting y consumo"
  fields:
    - id: context_description
      label: "¿Qué herramienta usa o prefiere el cliente?"
      required: true
    - id: decision_taken
      label: "¿Qué herramienta y modo de conexión elegiste?"
      required: false
    - id: outcome
      label: "¿Cómo resultó?"
      type: select
      options: ["anduvo", "no anduvo", "inconcluso", "en curso", "no lo sé"]
      required: true
