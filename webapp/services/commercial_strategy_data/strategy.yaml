    de contenidos que sostienen los canales inbound. Cada evento debe terminar cargado en el CRM con los
    contactos y la prospección asociada (Semillero de eventos · Pilar 4) — sin ese cierre, el evento no
    genera pipeline.'
segments:
  eyebrow: '[03]'
  title: Dónde jugamos
  intro: Seis segmentos, ordenados por prioridad. El Semillero de eventos es el segmento de mayor prioridad
    — es la puerta de entrada de contactos. Los Segmentos 2, 3 y 4 persiguen en conjunto los USD 250.000
    de licencias New Names. El Segmento 5 es la base instalada propia de Danwor (solo licencias, los otros
    USD 250K). El Segmento 6 es exclusivamente servicios (partners regionales).
  new_name_note: 'Es todo cliente nuevo para Danwor. En esta estrategia,
    **todos los segmentos son New Names excepto el Segmento 5** (base propia de Danwor), que es Base Instalada.
    Un cliente puede ser Base Instalada de SAP y, al mismo tiempo, New Name para Danwor — el Segmento
    2 (C-Field Base Instalada) es exactamente ese caso. La palabra "New Names" se lee siempre desde la
    óptica de Danwor, no de SAP.'
  items:
  - id: sgen
    tab_label: 1 · Semillero de eventos
    title: Semillero de eventos
    priority:
      code: p1
      text: PRIORIDAD 1
    notes:
    - 'Consolida los contactos que salen de los eventos ya realizados o agendados: SAP House, webinar
      ASUG, SAP Now, próximo evento. Es el punto de entrada más prioritario porque de ahí nace el trabajo
      de los demás segmentos. La máquina que produce estos contactos es el Pilar 2 (Generación de demanda).'
    access: null
    strategy:
    - Registrar en el CRM todas las oportunidades y prospectos con los que se habló en los eventos, y
      darles seguimiento — primer punto, el más urgente.
    - Consolidar la base completa de contactos de los eventos.
    - Mapear cada cuenta por madurez de datos y partner actual — pendiente, aún no está armado.
    - Recién con ese mapeo hecho, se prioriza y se agenda 1ª/2ª reunión aplicando el Pilar 4.
    pending:
      title: Pendiente de definir
      items:
      - 'Motor de generación de demanda: dueño del marketing, calendario de eventos/webinars/contenido
        y presupuesto asociado — hoy la demanda vive de eventos puntuales, falta el mecanismo que la sostenga.'
    extra_table: null
    subtabs: null
