annex_roles:
  eyebrow: '[10]'
  title: Mapa de roles y responsabilidades
  intro: Hoy el rol de Ejecutivo Comercial y el de Gerente Comercial – New Names son ocupados por la misma
    persona, Mary. Los roles quedan definidos igual, para que la estructura esté clara a medida que el
    equipo crezca.
  roles:
  - name: Ejecutivo Comercial
    who: 'Hunter / Closer — hoy: Mary'
    mision: 'Dueño absoluto del cierre en clientes nuevos: transformar oportunidades calificadas en revenue
      real, cerrar o perder rápido.'
    responsibilities:
    - Calificar oportunidades nuevas
    - Validar presupuesto, timing y decisores
    - Conducir la relación end-to-end
    - Liderar negociación y cierre
    - Mantener el CRM actualizado
    not_responsible:
    - Preventa técnica
    - Diseño de solución
    - Estimaciones técnicas
  - name: Gerente de Preventa
    who: Juan Manuel
    mision: Maximizar la probabilidad de cierre aportando credibilidad técnica y visión de solución.
    responsibilities:
    - Relevar necesidades técnicas
    - Diseñar la solución y estimar esfuerzo
    - Respaldar técnicamente la propuesta
    - Definición estratégica de oportunidades + seguimiento de indicadores
    not_responsible:
    - Negociación comercial
    - Discusión de precio
    - Cierre
  - name: Gerente Comercial — New Names
    who: Rol definido, hoy en Mary
    mision: Gobierno del pipeline, aceleración de cierres, ejecución directa en deals estratégicos.
    responsibilities:
    - Revisión semanal del funnel
    - Identificar oportunidades en riesgo o estancadas
    - Priorizar deals de alto impacto
    - Definir estrategia de cierre con socio
    not_responsible:
    - Preventa técnica
    - Base instalada (servicios)
    - Marketing operativo
  - name: Director Estratégico
    who: Gastón
    mision: Abrir puertas y sostener las relaciones de alto nivel en los 5 segmentos de New Names.
    responsibilities:
    - Apertura de 1ras reuniones en los 5 segmentos
    - Presidir la reunión semanal de indicadores
    - Participar en la definición estratégica de oportunidades
    not_responsible:
    - Ejecución operativa del día a día
    - Conducción comercial permanente
annex_process:
  eyebrow: '[11]'
  title: Etapas del pipeline
  intro: Prevalece la numeración definida en este proyecto (0 a 8) sobre versiones anteriores del proceso.
  stages:
  - n: '0'
    name: Prospecto
    meta: Posible oportunidad, sin confirmar
    gate: Pasa a Inicial cuando hay algo concreto para hacer.
  - n: '1'
    name: Inicial
    meta: Ejecutivo Comercial + Preventa
    gate: Arranca la obligación de completar las 5 preguntas del Pilar 4.
  - n: '2'
    name: Relevamiento
    meta: Preventa
    gate: Relevamiento técnico, diseño de solución viable.
  - n: '3'
    name: Armando orden de magnitud
    meta: Preventa
    gate: Estimación de esfuerzo.
  - n: '4'
    name: Coordinar presentación
    meta: Ejecutivo Comercial
    gate: Se agenda la presentación de la orden de magnitud.
  - n: '5'
    name: Orden presentada
    meta: Ejecutivo Comercial + Preventa
    gate: Se presenta la solución y se valida si encuentran valor — se busca feedback y espacio para corregir
      cualquier cosa. Antes de armar la propuesta formal, se busca al decisor para mostrarle 1 a 1 los
      valores que estamos viendo y tomarle la temperatura. Recién después se pasan esos valores como orden
      de magnitud al resto de los integrantes.
  - n: '6'
    name: Armando propuesta formal
    meta: Preventa
    gate: Ajuste de alcance según lo validado en la etapa 5.
  - n: '7'
    name: Validación operaciones
    meta: Operaciones (valida, no decide)
    gate: SLA de validación — Operaciones no habla con el cliente.
  - n: '8'
    name: Propuesta presentada
    meta: Ejecutivo Comercial
    gate: Propuesta presentada = fecha de decisión obligatoria en CRM.
  cooling_note: 'Más de 2 semanas sin respuesta del cliente = primera alerta.
    La oportunidad se marca como enfriada en el seguimiento semanal.'
annex_rules:
  eyebrow: '[12]'
  title: Reglas de oro
  intro: Complementan las 5 preguntas de calificación del Pilar 4 — gobiernan el proceso completo, no
    solo la entrada de una oportunidad.
  rules:
  - n: '01'
    title: Una oportunidad = un dueño
    detail: 'Toda oportunidad tiene un único responsable del cierre: el Ejecutivo Comercial. Nadie más
      puede ser dueño final del deal, aunque participe.'
  - n: '02'
    title: No hay propuesta sin validación de presupuesto
    detail: Nunca se presenta una propuesta si el cliente no confirmó previamente que el rango de precio
      está dentro de su presupuesto.
  - n: '03'
    title: Las propuestas se presentan, no se envían
    detail: Toda propuesta se presenta en vivo (Ejecutivo Comercial + Preventa). Presencial siempre que
      se pueda. No se envían por mail sin presentación previa.
  - n: '04'
    title: Propuesta presentada = fecha de decisión obligatoria
    detail: Toda propuesta debe tener cargada una fecha de decisión en CRM. Si no hay fecha, no se considera
      propuesta válida.
  - n: '05'
    title: No hay oportunidades en limbo
    detail: Ninguna oportunidad puede estar más de 30–45 días en etapa "propuesta" o "negociación" sin
      definición. Si pasa ese tiempo, entra Mary o el socio, o se pierde.
  - n: '06'
    title: Toda oportunidad debe tener próximo paso claro
    detail: 'Ninguna oportunidad puede estar sin "próximo paso" en CRM: acción concreta, responsable y
      fecha.'
  - n: '07'
    title: Los deals siempre son en dupla
    detail: Ejecutivo Comercial + Gerente de Preventa entran sí o sí juntos.
  - n: 08
    title: Las oportunidades perdidas se documentan
    detail: Toda oportunidad perdida debe tener motivo de pérdida, aprendizaje documentado y feedback
      cargado en CRM.
  - n: 09
    title: El cierre es responsabilidad, no consecuencia
    detail: No se "espera" que un deal cierre. Se conduce activamente hasta ganar o perder.
  - n: '10'
    title: Operaciones valida, no decide cerrar
    detail: Operaciones no habla con el cliente. SLA de validación de 72 hs máximo. Si dice "no", propone
      alternativa. Todo deal cerrado tiene OK operativo.
