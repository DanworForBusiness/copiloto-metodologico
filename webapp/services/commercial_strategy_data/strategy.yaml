focus:
  eyebrow: '[04]'
  title: Criterio de foco
  intro: Define cuándo una cuenta recibe tiempo activo del equipo. Las 5 preguntas son obligatorias —
    se completan en la 1ª o 2ª reunión con el cliente, sin excepción.
  questions:
  - n: 1
    text: ¿Tiene presupuesto?
  - n: 2
    text: ¿Quién toma la decisión?
  - n: 3
    text: ¿Cuál es el timing (cuándo)?
  - n: 4
    text: ¿Qué tiene actualmente (situación / arquitectura)?
  - n: 5
    text: ¿Qué prioridad tiene este proyecto dentro de la agenda propia del cliente?
  rules:
  - Obligatorio tenerlas completas en la 1ª o 2ª reunión con el cliente — no se sale de esas reuniones
    sin las 5 respuestas.
  - Las 5 respuestas determinan la priorización de la oportunidad — no es un corte binario, es el insumo
    que define qué tan arriba en la prioridad queda esa cuenta.
  coherence_note: 'Nota de coherencia con el Pilar 3: en el Segmento 2 (C-Field Base Instalada, Ale/Vero),
    el mapeo de madurez de datos ya cubre gran parte de la pregunta 4 antes de la primera reunión.'
capacity:
  eyebrow: '[05]'
  title: Asignación de capacidad
  assignments_table:
    headers:
    - Tarea
    - Responsable
    rows:
    - - Apertura de primeras reuniones / charlas estratégicas
      - Gastón
    - - Propuesta de solución y estimación de tiempos
      - Juan Manuel
    - - Ejecución operativa (calificación, seguimiento, cierre)
      - Mary
    - - Mapeo de cuentas en general
      - Mary
    - - Definición estratégica de oportunidades, temas estratégicos, indicadores
      - Gastón
    - - Ejecución del Segmento 5 · Base propia Danwor
      - Soledad (Client Partner), con apoyo de Mary
  priority_rules:
  - 'La prioridad para salir a buscar oportunidades es la definida por el orden de los segmentos: 1 (Semillero
    de eventos) → 2 (C-Field Base Instalada) → 3 (C-Field NNN) → 4 (C-Digital NNN) → 6 (Servicios / Partners).'
  - 'Excepción: una oportunidad caliente (con avance real) se prioriza por encima del orden de segmento,
    sin importar de cuál venga.'
  - El Segmento 5 (Base propia Danwor) corre como pista separada y en paralelo, a cargo de Soledad con
    apoyo de Mary — así se puede avanzar en más de un tema a la vez.
cadence:
  eyebrow: '[06]'
  title: Cadencia de revisión
  intro: El mecanismo que sostiene la estrategia en el tiempo.
  meetings:
  - freq: Lunes — Parte 1
    title: Seguimiento semanal (indicadores + demanda)
    participants: 'Participantes: Gastón, Mary, Juan Manuel'
    bullets:
    - Oportunidades nuevas generadas en la semana, por segmento — aporte a la meta de generación
    - 'Cobertura de pipeline: valor computado en el funnel vs. meta USD 2,0M (ratio 4x)'
    - Oportunidades calificadas acumuladas vs. meta ~14–15 (~7 New Names / ~7 Base Instalada)
    - Cumplimiento de las 5 preguntas en 1ª/2ª reunión
    - Win rate real vs. supuesto (40%) y ticket promedio real vs. supuesto (USD 90K computado)
    - Oportunidades enfriadas (+2 semanas sin respuesta)
    - Distribución por etapa de pipeline (0 a 8)
    - 'Avance acumulado: USD computado hacia 500K (250K New Names / 250K Base Instalada), horas hacia
      25.000'
    - Seguimiento de todas las tareas definidas como pendientes en el Pilar 8 (Próximos pasos)
  - freq: Lunes — Parte 2 y Jueves
    title: Definición de oportunidades
    participants: 'Participantes: Gastón, Mary, Juan Manuel'
    bullets:
    - Repaso de todas las oportunidades activas, una por una
    - 'Definición de estrategia por oportunidad: qué se ofrece, precio, posicionamiento'
    - Repaso de decisiones pendientes
    - Próximo paso concreto por oportunidad
  - freq: Quincenal
    title: Visión general y estrategia
    participants: 'Participantes: Gastón, Mary, Juan Manuel, Brian'
    bullets:
    - Avance consolidado hacia los objetivos del Pilar 1
    - Revisión del set completo de indicadores de seguimiento (los del Lunes — Parte 1)
    - Próximas oportunidades por cerrarse — deals con fecha de decisión cercana
    - Tema estratégico clave del período
    - Revisión de si la cadencia semanal se está sosteniendo
  note: Las decisiones que requieren al socio se toman en la reunión semanal de los lunes, no en la quincenal.
exclusions:
  eyebrow: '[07]'
  title: Qué no se hace
  items:
  - text: '**Servicios en Base Instalada** — no se trabajan bajo esta estrategia; el desarrollo de servicios
      ahí queda para otro equipo, en otro momento.'
  - text: '**Cuentas del Segmento 2 con Concentrix o BCI** ya instalados — se excluyen explícitamente.'
  - text: '**Cuentas que no completan las 5 preguntas** en la 1ª/2ª reunión — no reciben foco activo;
      no se invierte tiempo tratando de calificarlas indefinidamente.'
  - text: '**Partners sin compromiso real** (patrón Concentrix/Invenzis/BCI reactivos) — se les da la
      oportunidad del diagnóstico de madurez con expectativas claras; si no responden, no se sigue insistiendo.'
next_steps:
  eyebrow: '[08]'
  title: Próximos pasos
  intro: Todas las tareas concretas que quedaron definidas en la construcción de esta estrategia, con
    su segmento de origen, responsable y trimestre. Como el plan se pone en marcha sobre el cierre de
    2026, el grueso de las tareas se concentra en Q4 —apalancado en el calendario de eventos de demanda
    de septiembre a diciembre—, y seis tareas quedan con timing a definir.
  tasks:
  - id: t01
    tarea: Mapear cada cuenta por madurez de datos y partner actual
    origen: Segmento 1 · Semillero de eventos
    responsable: Mary
    q: Q4
  - id: t02
    tarea: Ejecutar el mapeo de madurez de cuentas (BW / Datasphere / sin nada)
    origen: Segmento 2 · C-Field Base Instalada
    responsable: Mary
    q: Q4
  - id: t03
    tarea: Ejecutar la campaña segmentada por resultado del mapeo
    origen: Segmento 2 · C-Field Base Instalada
    responsable: Mary
    q: Q4
  - id: t04
    tarea: Mapear las cuentas de Bárbara e identificar aquellas que están implementando RISE o GROW y
      aún no salieron en vivo
    origen: Segmento 3 · C-Field NNN
    responsable: Mary
    q: Q4
  - id: t05
    tarea: Definir el % de horas por trimestre
    origen: Pilar 1 · Objetivos
    responsable: Pendiente asignar
    q: Q4
  - id: t06
    tarea: Terminar el diagnosticador de madurez analítica (Copiloto)
    origen: Segmento 6 · Servicios / Partners
    responsable: Gastón + José
    q: Q4
  - id: t07
    tarea: Reunión con Majo y su equipo de vendedoras
    origen: Segmento 3 · C-Field NNN
    responsable: Gastón + Mary
    q: Q4
  - id: t08
    tarea: Definir con quién se arma la oferta empaquetada (b) de Business One
    origen: Segmentos 3 y 4
    responsable: Gastón
    q: Q4
  - id: t09
    tarea: Perfilar la base de clientes ya recibida para identificar cuáles abordar
    origen: Segmento 4 · C-Digital NNN
    responsable: Mary
    q: Q4
  - id: t10
    tarea: Mapear la cartera propia de Danwor (segmento, AE, partner, Datasphere/RISE)
    origen: Segmento 5 · Base propia Danwor
    responsable: Soledad
    q: Q4
  - id: t11
    tarea: Definir estrategia de abordaje sobre la cartera propia, una vez armado el mapeo
    origen: Segmento 5 · Base propia Danwor
    responsable: Gastón + Soledad
    q: a_definir
  - id: t12
    tarea: Validar el split real 50/50 de licencias con datos de pipeline
    origen: Pilar 1 · Objetivos
    responsable: Pendiente asignar
    q: a_definir
  - id: t13
    tarea: Definir formato de la actividad de invitación con los AEs
    origen: Segmento 2 · C-Field Base Instalada
    responsable: Gastón + Mary
    q: a_definir
  - id: t14
    tarea: Completar universo de partners tipo Pragmática
    origen: Segmento 3 · C-Field NNN
    responsable: Gastón
    q: a_definir
  - id: t15
    tarea: Identificar interés real en webinar conjunto con partners "en proceso"
    origen: Segmento 6 · Servicios / Partners
    responsable: Gastón
    q: a_definir
  - id: t16
    tarea: Organizar evento de generación de demanda con Invenzis y SAP (New Names puros)
    origen: Segmentos 3 y 4
    responsable: Gastón
    q: a_definir
  closing_note: El grueso de las tareas cae en Q4 (cierre de 2026); las últimas seis quedan con timing
    a definir. La asignación se ajusta en la cadencia de revisión a medida que avanza la ejecución.
