      - 1 / año
    - - Institucionales SAP
      - SAP House, SAP NOW, ASUG Motion, Transformation Day, PKOM, Partner Forum
      - Según agenda SAP
  calendar_intro: La bajada mensual de la ventana de ejecución en curso. Cada evento cierra con una
    acción de prospección — es donde nace el pipeline.
  calendar:
