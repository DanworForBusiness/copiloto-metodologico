      - LinkedIn Ads
      - Reuniones de descubrimiento + evaluación técnica gratuita
      - Eventos propios (CFO Meet Up) y clínicas de arquitectura con SAP
  events_catalog_intro: Formatos repetibles, con su cadencia anual. La bajada mensual (SAP Now, ASUG
    Motion, webinars, prospección) está en el calendario Sept–Dic de más abajo.
  events_catalog:
