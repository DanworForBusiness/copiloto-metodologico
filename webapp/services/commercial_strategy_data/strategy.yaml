hero:
  kicker: Estrategia comercial · New Names
  title_prefix: Dónde jugamos,
  title_accent: y cómo ganamos.
  lead: 'Seis pilares traducen el objetivo de negocio en decisiones concretas: a quién le vendemos,
    con qué criterio invertimos tiempo y cómo gobernamos la ejecución. El cierre operativo define
    los límites y transforma la estrategia en próximos pasos.'
  bignums:
  - value: USD 500K
    label: Licencias BDC — valor computado, New Names + Base Instalada
  - value: USD 2,0M
    label: Pipeline a generar — cobertura 4x sobre el objetivo
  - value: ~15
    label: Oportunidades calificadas a convertir (win rate 40%)
  - value: '25.000'
    label: Horas de servicios, 100% New Names
objectives:
  eyebrow: '[01]'
  title: Objetivos
  intro: 'Foco 100% en New Names. Hay dos clases de objetivo, y las dos se miden: los **objetivos de resultado**
    (licencias y servicios cerrados) y los **objetivos de generación** (el pipeline y las oportunidades
    que hay que producir para llegar a ese resultado). Las licencias se trabajan en New Names y Base Instalada;
    los servicios son exclusivos de New Names.'
  result_targets:
  - label: Licencias BDC
    value: USD 500.000
    detail: 'Valor computado: los contratos son a 3 años y se imputa la duración completa al primer año.
      Split: 50% New Names (USD 250K, desde los Segmentos 2–4) / 50% Base Instalada (USD 250K, desde el
      Segmento 5 — base propia de Danwor) — supuesto de trabajo, a ajustar con data real de pipeline.'
  - label: Servicios · New Names
    value: 25.000 horas
    detail: 'Los servicios van pegados a la licencia: no se vende una licencia BDC sin servicios de implementación.
      Las 25.000 horas se alimentan de los mismos deals New Names, no de un motor aparte. Distribución
      creciente Q1→Q4. Excepción: el Segmento 6 es servicios puros vía partners regionales.'
  calc_note: 'El objetivo se mide en **valor computado** (ticket anual × 3 años). El ticket mínimo de
    BDC es USD 20K/año; el promedio, USD 30K/año — cuanto más grande el cliente, más alto el ticket. Un
    dato a no confundir: los USD 500K son valor computado, no ingreso anual. A ticket promedio, 6 cierres
    son USD 500K para el objetivo pero **USD 180K de ingreso anual nuevo**.'
  ticket_table:
    headers:
    - Ticket
    - Anual
    - Computado (×3)
    rows:
    - - Mínimo
      - USD 20K
      - USD 60K
    - - Promedio
      - USD 30K
      - USD 90K
    - - Grande (ej.)
      - USD 50K
      - USD 150K
  funnel:
  - level: 1
    label: Pipeline a generar · cobertura 4x
    value: USD 2,0M
    sub: ≈ 22 oportunidades cargadas en el funnel
  - level: 2
    label: Oportunidades calificadas
    value: ~14–15 opps
    sub: con las 5 preguntas respondidas · ~7 New Names + ~7 Base Instalada
  - level: 3
    label: Cierres · win rate 40%
    value: ~6 cierres
    sub: 3 New Names + 3 Base Instalada
  - level: 4
    label: Objetivo de resultado
    value: USD 500K
    sub: valor computado de licencias BDC
  demand_targets:
  - label: Pipeline a generar
    value: USD 2,0M
    detail: Cobertura 4x sobre el objetivo (≈ 22 oportunidades a ticket promedio). Es la meta que la Generación
      de demanda (Pilar 2) tiene que producir — gobierna el tope del embudo.
  - label: Oportunidades calificadas
    value: ~14–15
    detail: 'Piso de conversión: oportunidades que llegan a etapa Inicial con las 5 preguntas respondidas
      (~7 New Names + ~7 Base Instalada). Es lo que la cadencia semanal vigila de cerca.'
  coverage_note: 'Son dos lentes distintos. Si generás 4x de pipeline
    (~22 opps) y ganás el 40%, cerrás ~9 deals ≈ USD 800K — 160% del objetivo. Ese colchón de ~50–60%
    por encima del piso de conversión es a propósito: absorbe los deals que caen al año siguiente, los
    que entran a ticket mínimo en vez de promedio, y los que rinden menos del 40%. El 4x manda sobre la
    generación de demanda; las ~14–15 oportunidades calificadas, sobre la conversión.'
  sensitivity_note: El número de oportunidades a manejar depende mucho de dónde caiga el ticket. Cuanto
    más apuntes a cuentas grandes (C-Field, +USD 50M/año), menos deals hay que correr para el mismo objetivo.
  sensitivity_table:
    headers:
    - Escenario
    - Cierres p/ 500K
    - Opps calificadas (÷40%)
    - Opps en pipeline (4x)
    rows:
    - - Todo al mínimo (60K comp.)
      - ~9
      - ~22
      - ~33
    - - Promedio (90K comp.)
      - ~6
      - ~14–15
      - ~22
    - - Sesgo a grandes (150K comp.)
      - ~4
      - ~10
      - ~13
  assumptions_pending:
  - Split real 50/50 de licencias — reemplazar por dato validado cuando exista visibilidad de pipeline
  - '% de horas de servicios por trimestre — a definir en función de la maduración de los segmentos del
    Pilar 3'
  - Win rate 40% parejo entre New Names y Base Instalada — la base instalada suele convertir más alto;
    diferenciar cuando haya histórico
  - Ciclo de venta promedio (¿3 / 6 / 9 meses?) — define cuándo hay que generar el pipeline para que los
    cierres caigan en 2026, no en 2027
demand_generation:
  eyebrow: '[02]'
  title: Generación de demanda
  intro: La máquina que llena el funnel. Define qué vendemos, por qué canales generamos conversaciones
    y con qué eventos abrimos puertas — es lo que alimenta al Semillero de eventos y, a través de él,
    a todos los segmentos del Pilar 3.
  demand_target:
    label: Horas · New Names 2026
    value: 25.000 horas
    detail: La demanda se mide en horas y coincide con el objetivo de servicios del Pilar 1. Las licencias
      (USD 500K) se apalancan sobre la misma máquina — cada oportunidad de servicios trae su licencia.
      Con win rate 40% y cobertura 4x (Pilar 1).
  clusters_intro: 'Lo que vendemos, con su ticket en horas, su decisor y el mensaje que abre la
    conversación. Todo es BDC con distintos enfoques: migración, arquitectura, gobierno y analítica/IA.'
  clusters:
  - tag: Cluster 1 · Principal revenue
    name: Modernización SAP
    bullets:
    - '**BW → BDC** (Datasphere · modelar)'
    - '**BO → BDC** (SAC · explotar)'
    - '**BPC → BDC** (SAC Planning)'
    - 'Target: CIO / Arquitectura / CFO. Cierre 6–12 meses.'
    message: '"El BW no muere hoy, pero ya no escala ni habilita IA."'
  - tag: Cluster 2 · Estratégico
    name: Data Platform & Arquitectura
    bullets:
    - '**Greenfield BDC** (modelado + explotación + planificación)'
    - 'Perfil: múltiples fuentes, Excel y reportes manuales.'
    - 'Target: CTO / CDO. Tickets altos.'
    message: '"Tenés datos, pero no una plataforma."'
  - tag: Cluster 3 · Emergente
    name: Data Governance
    bullets:
    - '**Gobierno del dato** end-to-end'
    - Madurez creciente, altísimo potencial.
    - 'Target: CIO / Riesgo / Compliance / Data Owners.'
    message: '"Sin gobierno del dato, no hay IA ni decisiones confiables."'
  - tag: Cluster 4 · Abre puertas
    name: Advanced Analytics & IA
    bullets:
    - '**BDC + Databricks + IA** sobre datos'
    - 'Rol: diferenciación y posicionamiento.'
    - 'Target: CTO / Innovación / Data Science.'
    message: '"La IA sin datos confiables es solo humo."'
  channels:
    inbound:
      title: Inbound · atraer
      items:
      - Estrategia de contenidos (posts, whitepapers, casos de éxito)
