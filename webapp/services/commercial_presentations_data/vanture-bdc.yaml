  s6_card1_eyebrow: "FINANZAS"
  s6_card1_title: "Capital de trabajo en tiempo real"
  s6_card1_body: "Hoy consultarlo suele requerir cruces manuales entre sistemas. Con una base unificada, finanzas ve el impacto de las operaciones apenas ocurre, y no al cierre del período."
  s6_card2_eyebrow: "CADENA DE SUMINISTRO"
  s6_card2_title: "Anticipar quiebres de stock antes de que ocurran"
  s6_card2_body: "Cruzando demanda, inventario y proveedores en una sola capa, los agentes de IA detectan riesgos de desabastecimiento con anticipación y proponen ajustes de reposición."
  s6_card3_eyebrow: "EXPERIENCIA DEL CLIENTE"
  s6_card3_title: "Un mismo contexto de cliente para ventas, cobranzas y atención"
  s6_card3_body: "Cuando todas las áreas parten de la misma definición de cliente, cada interacción se apoya en el historial completo y los agentes priorizan con criterio de negocio."
  s6_next: "Por qué BDC"
  # Slide 7
  s7_nav: "Por qué BDC"
  s7_title: "¿Por qué SAP BDC es la plataforma correcta?"
  s7_lead: "Una plataforma analítica gobernada, flexible y lista para escalar hacia IA."
  s7_label: "BENEFICIOS SAP BDC"
  s7_hint: "PASÁ EL MOUSE POR CADA PILAR PARA VER EL DETALLE"
  s7_p1_title: "Gobierno de datos"
  s7_p1_claim_1: "Una única fuente de la verdad"
  s7_p1_claim_2: "Linaje trazable: S/4HANA → reporte"
  s7_p1_claim_3: "Conserva la capa semántica de reglas de negocio de SAP, centralizadas (zero copy)"
  s7_p1_claim_4: "Integra BW PCE"
  s7_p2_title: "Flexibilidad analítica"
  s7_p2_claim_1: "Self-service"
  s7_p2_claim_2: "Nativo con SAC y abierto a otros productos de explotación"
  s7_p2_claim_3: "Filtros dinámicos, sin errores de datos"
  s7_p2_claim_4: "Sin dependencia de IT para reportes"
  s7_p3_title: "Escalabilidad y futuro"
  s7_p3_claim_1: "Permite sprints y MVPs"
  s7_p3_claim_2: "Base lista para IA y Databricks"
  s7_p3_claim_3: "Incorpora fuentes SAP y no SAP nuevas fácilmente"
  s7_p3_claim_4: "Inversión que escala sin rediseño"
  s7_p4_title: "ROI y reducción de riesgo"
  s7_p4_claim_1: "Menos tiempo en preparar reportes"
  s7_p4_claim_2: "Decisiones basadas en datos confiables"
  s7_p4_claim_3: "Menor dependencia de perfiles técnicos"
  s7_p4_claim_4: "Costo marginal bajo para nuevos análisis"
  s7_next: "Cómo empezar"
  # Slide 8
  s8_nav: "Cómo empezar"
  s8_title: "¿Cómo empezar este camino?"
  s8_lead: "Cuatro pasos, de lo concreto a lo escalable. Primero el dato, después la IA."
  s8_label: "RECOMENDACIONES"
  s8_step1_title: "Diagnosticar el estado de los datos"
  s8_step1_body: "Identificar dónde están los datos, quién los usa y qué tan confiables son hoy."
  s8_step2_title: "Elegir un dominio de negocio prioritario"
  s8_step2_body: "Empezar por el proceso donde una decisión más rápida tiene mayor impacto."
  s8_step3_title: "Construir la base semántica con BDC"
  s8_step3_body: "Unificar y contextualizar los datos de ese dominio antes de sumar IA."
  s8_step4_title: "Escalar con gobierno"
  s8_step4_body: "Sumar agentes y casos de uso nuevos sobre una base ya gobernada y confiable."
  s8_next: "Tu punto de partida"
  # Slide 9
  s9_nav: "Tu punto de partida"
  s9_title: "Tres puntos de partida, tres caminos"
  s9_lead: "El camino depende de lo que ya tenés. No hay una única ruta correcta: el diagnóstico del paso 01 es el que la define."
  s9_label: "LIFT & SHIFT · GREENFIELD · PLANIFICACIÓN"
  s9_path1_eyebrow: "YA TENGO SAP BW"
  s9_path1_title: "Lift & shift de BW"
  s9_path1_body: "Llevar el BW existente a BDC mediante BW PCE, preservando modelos y reportes, y modernizar por etapas sobre la misma plataforma."
  s9_path1_when_label: "CUÁNDO CONVIENE"
  s9_path1_when: "Hay una inversión importante en modelos y reportes activos que querés conservar mientras evolucionás."
  s9_path2_eyebrow: "EMPIEZO DE CERO"
  s9_path2_title: "Greenfield sobre BDC"
  s9_path2_body: "Construir la capa semántica nueva sobre productos de datos de SAP, sin arrastrar modelos legados."
  s9_path2_when_label: "CUÁNDO CONVIENE"
  s9_path2_when: "El BW actual está subutilizado, desactualizado o es una deuda técnica que no querés migrar."
  s9_path3_eyebrow: "USO BPC"
  s9_path3_title: "Planificación hacia SAC"
  s9_path3_body: "Evolucionar la planificación y consolidación a SAP Analytics Cloud, apoyada en la misma base de datos gobernada."
  s9_path3_when_label: "CUÁNDO CONVIENE"
  s9_path3_when: "La planificación vive hoy en BPC y querés unificarla con la analítica y la IA."
  s9_callout_intro: "Los tres caminos convergen en el mismo lugar:"
  s9_callout_highlight: "una base semántica gobernada sobre la que sumar agentes y casos de uso nuevos"
  s9_callout_tail: ". Lo que cambia es el punto de partida y el ritmo."
  s9_next: "Conclusión"
