title: Vanture · La empresa autónoma comienza con los datos
content:
  hero_title_prefix: La empresa autónoma comienza con los
  hero_title_accent: datos
  hero_lead: Descubre cómo SAP Business Data Cloud y Business AI están transformando la manera en que las organizaciones integran,
    gobiernan y convierten sus datos en decisiones inteligentes.
  s2_stat_value: 7 de 10
  s2_stat_label: organizaciones quedan estancadas en modo piloto, sin un camino claro para escalar.
  cta_title_prefix: El primer paso hacia la empresa autónoma
  cta_title_accent: es el dato
  cta_lead: Te ayudamos a evaluar tu punto de partida y a diseñar el primer caso de uso sobre SAP Business Data Cloud.
  cta_qr_caption: Agendá una demo — escaneá el código
  alliance_1_title: Partners tecnológicos líderes
  alliance_1_body: Somos socios de las plataformas más reconocidas a nivel global — SAP, Google, Databricks, AWS.
  alliance_2_title: Procesos de calidad certificados
  alliance_2_body: Todos nuestros procesos están certificados bajo la norma ISO 9001.
  alliance_3_title: Una cultura que potencia resultados
  alliance_3_body: Reconocidos como Great Place to Work — la colaboración y la excelencia son el motor de Danwor.
  alliance_4_title: Somos referentes de Analytics
  alliance_4_body: Trabajando colaborativamente con otros implementadores, junto a clientes como Loma Negra, Danone y Ayudín.
  recognition_intro: Algunos de nuestros casos de éxito fueron reconocidos por el
  recognition_highlight: ASUG Innovation Award
  recognition_tail: ', un premio que distingue los proyectos más innovadores, estratégicos y de alto impacto del ecosistema
    SAP. Además expusimos el caso Danone en SAP NOW 2025 y el caso Simpa en SAP HOUSE 2026.'
  # Slide 1
  hero_kicker: "SAP Business Data Cloud"
  # Slide 2
  s2_nav: "El límite no es la IA"
  s2_title: "El límite no es la tecnología de IA. Es el estado de los datos que la alimentan."
  s2_lead: "La IA está en todas partes; los resultados, no. El cuello de botella son los datos."
  s2_cards_label: "DE LA VISIÓN A LA EJECUCIÓN"
  s2_card1_title: "Falta de contexto de negocio"
  s2_card1_body: "Los datos existen, pero sin el significado de proceso que la IA necesita para razonar."
  s2_card2_title: "Datos dispersos y sin integrar"
  s2_card2_body: "Sistemas SAP y no SAP conviven sin una capa común que los conecte."
  s2_card3_title: "Falta de gobernanza y confianza"
  s2_card3_body: "Sin trazabilidad ni control, ninguna decisión automatizada es sostenible."
  s2_next: "Qué es SAP Business Data Cloud"
  # Slide 3
  s3_nav: "Qué es SAP BDC"
  s3_title: "¿Qué es SAP Business Data Cloud?"
  s3_lead: "Una capa semántica unificada que conecta datos SAP y no SAP, y los organiza en productos de datos listos para usar."
  s3_lead_highlight: "La base de datos para la IA."
  s3_callout_intro: "En lugar de mover y replicar datos entre sistemas, BDC les da un"
  s3_callout_highlight: "significado de negocio común"
  s3_callout_tail: ": la misma definición de cliente, orden o inventario en toda la organización. Sin una base confiable y unificada, los agentes de IA no tienen sobre qué razonar."
  s3_next: "Knowledge Core"
  # Slide 4
  s4_nav: "Knowledge Core"
  s4_title: "Knowledge Core: el contexto, definido una vez"
  s4_lead_1: "Cómputo y almacenamiento gestionan"
  s4_lead_em_1: "cómo"
  s4_lead_2: "se procesan los datos. El núcleo de conocimiento define"
  s4_lead_em_2: "qué significan"
  s4_lead_3: "para el negocio y garantiza que ese contexto se aplique de forma coherente en todo el ámbito."
  s4_diagram_label: "KNOWLEDGE CORE"
  s4_callout_text: "Más que un grafo de conocimiento: es la semántica empresarial, los productos de datos, los modelos analíticos y las simulaciones, reunidos en un sistema unificado que evoluciona con el negocio."
  s4_callout_highlight: "Sin él, cada caso de uso empieza desde cero. Con él, la IA actúa con juicio, no solo con rapidez."
  s4_next: "Ecosistema abierto"
  # Slide 5
  s5_nav: "Ecosistema abierto"
  s5_title: "Un ecosistema de datos abierto"
  s5_lead: "Con BDC Connect, SAP comparte datos y metadatos SAP y no SAP entre plataformas, sin copiarlos — maximizando las inversiones existentes y preservando el contexto empresarial."
  s5_cards_label: "ECOSISTEMA ABIERTO"
  s5_card1_title: "Zero-copy"
  s5_card1_body: "Los datos se comparten sin duplicarlos ni moverlos entre plataformas."
  s5_card2_title: "Metadata sharing"
  s5_card2_body: "El significado de negocio viaja con el dato: el contexto no se pierde en el camino."
  s5_card3_title: "SAP & non-SAP"
  s5_card3_body: "Una sola capa semántica sobre ambos mundos."
  s5_next: "Casos de uso por dominio"
  # Slide 6
  s6_nav: "Casos de uso"
  s6_title: "Dominios donde una plataforma unificada cambia la velocidad de decisión"
  s6_lead: "Cada perfil ejecutivo tiene casos de uso y productos de datos listos para usar sobre la misma base."
