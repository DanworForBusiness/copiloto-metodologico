<div id="module-feedback" class="module-feedback tree-feedback">
  {% if submitted %}
  <div class="feedback-thanks"><span>{{ "&#128077;"|safe if rating == "up" else "&#128078;"|safe }}</span><div><p>Gracias, registramos tu feedback sobre este m&oacute;dulo.</p></div></div>
  {% else %}
  <form hx-post="/modules/{{ document.summary.stem }}/feedback" hx-target="#module-feedback" hx-swap="outerHTML">
    <input type="hidden" name="pack" value="{{ pack }}">
    <span>&iquest;Te result&oacute; &uacute;til este contenido?</span>
    <div><button type="submit" name="rating" value="up" aria-label="Fue util" title="Fue util">&#128077;</button><button type="submit" name="rating" value="down" aria-label="No fue util" title="No fue util">&#128078;</button></div>
  </form>
  {% endif %}
</div>
