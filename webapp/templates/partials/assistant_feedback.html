<div id="assistant-feedback-{{ reply.id }}" class="assistant-feedback">
  <form hx-post="/assistant/responses/{{ reply.id }}/feedback" hx-target="#assistant-feedback-{{ reply.id }}" hx-swap="outerHTML">
    <span>¿Te resultó útil esta respuesta?</span>
    <div>
      <button type="submit" name="rating" value="up" aria-label="Fue útil" title="Fue útil">👍</button>
      <button type="submit" name="rating" value="down" aria-label="No fue útil" title="No fue útil">👎</button>
    </div>
  </form>
</div>
