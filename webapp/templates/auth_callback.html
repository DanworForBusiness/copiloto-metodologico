<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c0c0d">
  <title>Completando acceso · Danwor Hub</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='brand-hero.css') }}?v={{ static_version }}">
</head>
<body class="auth-completing">
  <!-- Documento NEUTRO para el popup/callback de Microsoft (auth_popup=1 o
       code=...) — deliberadamente SIN el copy/branding específico de "/",
       "/copilot" ni "/onedanwor" (nunca la landing de ninguno de los dos:
       ese fue el bug real que este documento separado resuelve — un
       overlay no alcanza porque el marcado seguía existiendo debajo).
       El <title> SÍ usa "Danwor Hub" — el paraguas de plataforma que
       cubre a cualquier entrada (Copiloto u Operaciones) durante este
       paso intermedio, nunca un producto específico ni el naming
       histórico previo de la plataforma (ver Danwor Hub Login Identity
       Alignment en HANDOFF). El BODY sigue sin ningún logo/wordmark —
       solo lo necesario para que auth.js complete el flujo. -->
  <button id="microsoft-login-btn" data-home="{{ home_url }}" style="display:none" aria-hidden="true" tabindex="-1"></button>
  <div class="auth-overlay" aria-hidden="true"><span class="auth-spinner"></span>Completando acceso…</div>
  <div id="login-message" class="login-error hidden"></div>
  <script src="{{ url_for('static', path='auth.js') }}?v={{ static_version }}"></script>
</body>
</html>
