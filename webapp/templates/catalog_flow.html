{% extends "base.html" %}
{% block title %}{{ cliente }} · {{ dominio }} · Catálogo Danwor{% endblock %}
{% block body %}
<div
  x-data="copilotLayout('{{ active_group }}', {{ 'true' if readonly else 'false' }})"
  x-init="init()"
  class="app-shell no-copilot"
>
  <header class="topbar">
    <a href="/?pack={{ pack }}" class="animated-brand" aria-label="Danwor · Inicio">
      <iframe src="/brand/dancing/{{ pack }}" title="Danwor" tabindex="-1" aria-hidden="true"></iframe>
    </a>
    <div class="header-tools">
      {% include "partials/workspace_switcher.html" %}
      <button class="theme-toggle" @click="toggleTheme()" :title="contentTheme === 'light' ? 'Usar contenido oscuro' : 'Usar contenido claro'" aria-label="Alternar tema del contenido">
        <svg x-cloak x-show="contentTheme === 'light'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3V1m0 22v-2M3 12H1m22 0h-2M4.2 4.2 2.8 2.8m18.4 18.4-1.4-1.4m0-15.6 1.4-1.4M2.8 21.2l1.4-1.4M17 12a5 5 0 1 1-10 0 5 5 0 0 1 10 0Z"/></svg>
        <svg x-cloak x-show="contentTheme === 'dark'" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A9 9 0 0 1 8.5 3.5a9 9 0 1 0 12 12Z"/></svg>
      </button>
      <button class="theme-toggle logout-btn" type="button" onclick="dwLogout()" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
      <button class="mobile-menu" @click="navOpen=!navOpen">Módulos</button>
    </div>
  </header>

  {% include "partials/copilot_nav.html" %}

  <main id="content" class="module-content">
    {% include "partials/catalog_flow_content.html" %}
  </main>
</div>
{% endblock %}
