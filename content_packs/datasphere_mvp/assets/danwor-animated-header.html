<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #f5f5f5;
    width: 100%;
    height: 100%;
    font-family: 'Inter', sans-serif;
  }

  .layout {
    display: flex;
    align-items: center;
    width: 100%;
    height: 100px;
    padding: 0 24px;
    gap: 0;
    position: relative;
    overflow: hidden;
  }

  .panel-left {
    flex: 0 0 auto;
    height: 100px;
    display: flex;
    align-items: center;
    position: relative;
    min-width: 240px;
    overflow: visible;
    padding-bottom: 6px;
  }

  .main-row {
    position: relative;
    height: 67px;
  }

  .word {
    position: absolute;
    top: 0; left: 0;
    display: flex;
    align-items: center;
    height: 80px;
    white-space: nowrap;
  }

  /* DANWOR characters */
  .ch {
    font-family: 'Rajdhani', 'Arial Black', sans-serif;
    font-weight: 700;
    font-size: 72px;
    color: #363636;
    line-height: 1;
    letter-spacing: 2px;
    display: inline-block;
    will-change: transform, opacity;
  }
  .chA {
    font-family: 'Rajdhani', 'Arial Black', sans-serif;
    font-weight: 700;
    font-size: 65px;
    color: #363636;
    padding-top: 5px;
    line-height: 1;
    letter-spacing: 2px;
    display: inline-block;
    will-change: transform, opacity;
  }

  /* I+D word — each letter is an individual span */
  #wId {
    opacity: 0;
    pointer-events: none;
  }
  #wId .ch {
    font-size: 72px;
    letter-spacing: 1px;
    transition: opacity 0.06s linear;
  }
  .gold { color: #EAB308; }

  /* ── DIVIDER ── */
  .divider {
    width: 1px;
    height: 60px;
    background: #d0d0d0;
    margin: 0 28px;
    flex-shrink: 0;
    align-self: center;
  }

  /* ── PANEL RIGHT ── */
  .panel-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 0;
    position: relative;
    overflow: hidden;
  }

  .title-wrapper {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
  }

  .title-line {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.2;
    color: #1a1a1a;
    letter-spacing: -0.2px;
    white-space: nowrap;
    display: flex;
    flex-wrap: nowrap;
    align-self: flex-start;
  }

  .subtitle-line {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 12px;
    opacity: 0.7;
    margin-top: 4px;
    color: #888;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .title-line .tc {
    display: inline-block;
    position: relative;
    transition: none;
  }

  /* Ultra-subtle shimmer — barely perceptible, just a whisper of light */
  .tc.lit {
    animation: charShimmer 0.55s ease-out forwards;
  }

  @keyframes charShimmer {
    0%   { color: inherit;               text-shadow: none; }
    25%  { color: rgba(255,255,255,0.35); text-shadow: 0 0 6px rgba(201,150,10,0.07), 0 0 2px rgba(255,255,255,0.15); }
    55%  { color: rgba(140,110,30,0.6);  text-shadow: 0 0 3px rgba(201,150,10,0.05); }
    100% { color: inherit;               text-shadow: none; }
  }

  /* ── BULLET ── */
  #bullet {
    position: fixed;
    top: 0;
    left: 0;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 52px;
    color: #EAB308;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
    z-index: 100;
    line-height: 1;
    text-shadow: 0 0 16px rgba(201,150,10,0.5);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="layout" id="layout">

  <!-- LEFT PANEL -->
  <div class="panel-left" id="panelLeft">
    <div class="main-row" id="mainRow">

      <!-- DANWOR -->
      <div class="word" id="wDan">
        <span class="ch"  id="chD">D</span>
        <span class="chA" id="chALambda">Ʌ</span>
        <span class="ch"  id="chNwor">NWOR</span>
      </div>

      <!-- INNOVACIÓN + DESARROLLO — each killable letter is its own span -->
      <div class="word" id="wId" style="opacity:0; pointer-events:none;">
        <!--  I  -->
        <span class="ch" id="lI"     style="opacity:0">I</span>
        <!--  NNOVACIÓ  -->
        <span class="ch" id="lN1"    style="opacity:0">N</span>
        <span class="ch" id="lN2"    style="opacity:0">N</span>
        <span class="ch" id="lO1"    style="opacity:0">O</span>
        <span class="ch" id="lV"     style="opacity:0">V</span>
        <span class="ch" id="lA1"    style="opacity:0">A</span>
        <span class="ch" id="lC"     style="opacity:0">C</span>
        <span class="ch" id="lI2"    style="opacity:0">I</span>
        <span class="ch" id="lO2"    style="opacity:0">Ó</span>
        <!--  N  ← the one that becomes I  -->
        <span class="ch" id="lNlast" style="opacity:0">N</span>
        <!--  space + space  -->
        <span class="ch gold" id="lPlus" style="opacity:0">&nbsp;+&nbsp;</span>
        <!--  D  -->
        <span class="ch" id="lD"     style="opacity:0">D</span>
        <!--  ESARROLLO  -->
        <span class="ch" id="lE"     style="opacity:0">E</span>
        <span class="ch" id="lS"     style="opacity:0">S</span>
        <span class="ch" id="lA2"    style="opacity:0">A</span>
        <span class="ch" id="lR1"    style="opacity:0">R</span>
        <span class="ch" id="lR2"    style="opacity:0">R</span>
        <span class="ch" id="lO3"    style="opacity:0">O</span>
        <span class="ch" id="lL1"    style="opacity:0">L</span>
        <span class="ch" id="lL2"    style="opacity:0">L</span>
        <span class="ch" id="lO4"    style="opacity:0">O</span>
      </div>

    </div>
  </div>

  <!-- DIVIDER -->
  <div class="divider"></div>

  <!-- RIGHT PANEL -->
  <div class="panel-right" id="panelRight">
    <div class="title-wrapper">
      <div class="title-line" id="titleLine"></div>
      <div class="subtitle-line" id="subtitleLine">SAP Datasphere · BDC-Ready · Inteligencia metodológica</div>
    </div>
  </div>

</div>

<!-- BULLET -->
<div id="bullet">&gt;</div>

<script>
  // ── REFS ──
  const chD       = document.getElementById('chD'),
        chNwor    = document.getElementById('chNwor'),
        chALambda = document.getElementById('chALambda'),
        wDan      = document.getElementById('wDan'),
        wId       = document.getElementById('wId'),
        mainRow   = document.getElementById('mainRow'),
        bullet    = document.getElementById('bullet'),
        panelLeft = document.getElementById('panelLeft'),
        panelRight= document.getElementById('panelRight'),
        titleLine = document.getElementById('titleLine');

  // All I+D letter spans in order, tagged with their role
  // role: 'keep' = stays, 'kill' = erased by bullet, 'convert' = N→I
  const idLetters = [
    { el: document.getElementById('lI'),     role: 'kill'    },
    { el: document.getElementById('lN1'),    role: 'kill'    },
    { el: document.getElementById('lN2'),    role: 'kill'    },
    { el: document.getElementById('lO1'),    role: 'kill'    },
    { el: document.getElementById('lV'),     role: 'kill'    },
    { el: document.getElementById('lA1'),    role: 'kill'    },
    { el: document.getElementById('lC'),     role: 'kill'    },
    { el: document.getElementById('lI2'),    role: 'kill'    },
    { el: document.getElementById('lO2'),    role: 'kill'    },
    { el: document.getElementById('lNlast'), role: 'convert' }, // N → I
    { el: document.getElementById('lPlus'),  role: 'keep'    },
    { el: document.getElementById('lD'),     role: 'keep'    },
    { el: document.getElementById('lE'),     role: 'kill'    },
    { el: document.getElementById('lS'),     role: 'kill'    },
    { el: document.getElementById('lA2'),    role: 'kill'    },
    { el: document.getElementById('lR1'),    role: 'kill'    },
    { el: document.getElementById('lR2'),    role: 'kill'    },
    { el: document.getElementById('lO3'),    role: 'kill'    },
    { el: document.getElementById('lL1'),    role: 'kill'    },
    { el: document.getElementById('lL2'),    role: 'kill'    },
    { el: document.getElementById('lO4'),    role: 'kill'    },
  ];

  // ── BUILD title spans ──
  const TITLE = 'Copiloto Metodológico | Arquitecto Danwor';
  function buildSpans(el, text) {
    el.innerHTML = '';
    [...text].forEach(ch => {
      const s = document.createElement('span');
      s.className = 'tc';
      s.textContent = ch === ' ' ? '\u00a0' : ch;
      el.appendChild(s);
    });
  }
  buildSpans(titleLine, TITLE);

  // ── WIDTH MATCHING for I+D ──
  function matchWidths() {
    // Use visibility so layout is measured without ever making letters visible
    wId.style.visibility = 'hidden';
    wId.style.opacity    = '0';
    // Temporarily make all spans opacity:1 for measurement only (wId is invisible)
    const allCh = wId.querySelectorAll('.ch');
    allCh.forEach(el => el.style.opacity = '1');

    const danworW = wDan.getBoundingClientRect().width;
    let lo = 8, hi = 72, mid, best = 20;
    for (let i = 0; i < 30; i++) {
      mid = (lo + hi) / 2;
      allCh.forEach(el => el.style.fontSize = mid + 'px');
      const idW = wId.getBoundingClientRect().width;
      if (idW < danworW) lo = mid; else hi = mid;
      best = mid;
    }
    allCh.forEach(el => el.style.fontSize = best + 'px');
    mainRow.style.width = danworW + 'px';

    // Reset all spans back to hidden before animation starts
    allCh.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateX(-55px)'; });
    wId.style.visibility = '';
    wId.style.opacity    = '0';
  }

  // ── TWEEN UTILS ──
  const HOLD = 3000, OUT = 360, BACK = 420, SH = 50;
  const ease = t => t < .5 ? 2*t*t : -1 + (4-2*t)*t;
  const tw = (dur, fn) => new Promise(res => {
    const s = performance.now();
    (function f(n) {
      const t = ease(Math.min((n-s)/dur, 1));
      fn(t);
      t < 1 ? requestAnimationFrame(f) : res();
    })(performance.now());
  });
  const after = (d, dur, fn) => new Promise(r => setTimeout(() => tw(dur,fn).then(r), d));

  // ── RESET ──
  function reset() {
    // DANWOR visible
    chD.style.transform = 'translateX(0)'; chD.style.opacity = '1';
    chNwor.style.opacity = '1'; chNwor.style.transform = 'translateX(0)';
    chALambda.style.opacity = '1'; chALambda.style.transform = 'translateX(0)';

    // I+D word fully hidden
    wId.style.opacity = '0';
    wId.style.pointerEvents = 'none';

    // Every span: invisible and offset — no exceptions
    idLetters.forEach(({ el, role }) => {
      el.style.opacity   = '0';
      el.style.transform = 'translateX(-55px)';
      el.style.transition = '';
      el.style.color = ''; // clear any gold flash from convert
      if (role === 'convert') el.textContent = 'N';
    });
  }

  // ── BULLET + LETTER-KILL ANIMATION ──
  // The bullet travels across the I+D word killing letters as it passes each one
  function fireBulletKill() {
    return new Promise(resolve => {
      const wIdRect    = wId.getBoundingClientRect();
      const rightRect  = panelRight.getBoundingClientRect();

      // Bullet travels from left edge of word to past right panel
      const startX  = wIdRect.left - 20;
      const endX    = rightRect.right + 80;
      const topY    = wIdRect.top + wIdRect.height / 2;

      // Pre-compute each letter's center X position (viewport coords)
      const letterPositions = idLetters.map(({ el }) => {
        const r = el.getBoundingClientRect();
        return r.left + r.width / 2;
      });

      // Track which letters have already been processed
      const processed = new Array(idLetters.length).fill(false);

      bullet.style.left      = startX + 'px';
      bullet.style.top       = topY + 'px';
      bullet.style.transform = 'translateY(-50%)';
      bullet.style.opacity   = '0';

      const BULLET_DUR = 600;
      let shimmerFired = false;
      const s = performance.now();

      function frame(now) {
        const raw = (now - s) / BULLET_DUR;
        const t   = Math.min(raw, 1);
        // Linear-fast easing
        const et  = t < 0.75 ? t / 0.75 : 1;

        const x = startX + (endX - startX) * et;

        bullet.style.left    = x + 'px';
        bullet.style.opacity = t < 0.04 ? (t / 0.04).toString()
                             : t > 0.88 ? ((1 - t) / 0.12).toString()
                             : '1';

        // Check each letter — kill/convert when bullet passes its center
        idLetters.forEach(({ el, role }, i) => {
          if (!processed[i] && x > letterPositions[i]) {
            processed[i] = true;
            if (role === 'kill') {
              // Instant vanish (at animation speed it's imperceptible anyway)
              el.style.opacity = '0';
            } else if (role === 'convert') {
              // Replace N with I — flash it briefly
              el.textContent = 'I';
              el.style.color = '#EAB308';
              setTimeout(() => { el.style.color = '#363636'; }, 180);
            }
            // 'keep' letters: do nothing, they stay
          }
        });

        // Shimmer fires when bullet crosses into right panel
        if (!shimmerFired && x >= rightRect.left) {
          shimmerFired = true;
          shimmerTitle();
        }

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          bullet.style.opacity = '0';
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  // ── SHIMMER — ultra subtle, title only ──
  function shimmerTitle() {
    const chars = [...titleLine.querySelectorAll('.tc')];
    const STAGGER = 36;
    chars.forEach((el, i) => {
      setTimeout(() => {
        el.classList.remove('lit');
        void el.offsetWidth;
        el.classList.add('lit');
        el.addEventListener('animationend', () => el.classList.remove('lit'), { once: true });
      }, i * STAGGER);
    });
  }

  // ── MAIN CYCLE ──
  async function cycle() {
    reset();
    await new Promise(r => setTimeout(r, HOLD));

    // Phase 1: DANWOR → INNOVACIÓN + DESARROLLO
    // Make wId container visible only on next frame (spans are already opacity:0)
    requestAnimationFrame(() => { wId.style.opacity = '1'; });
    await Promise.all([
      tw(OUT, t => {
        chNwor.style.opacity = 1 - t;
        chNwor.style.transform = `translateX(${t * 14}px)`;
        chALambda.style.opacity = 1 - t;
        chALambda.style.transform = `translateX(${t * 14}px)`;
      }),
      tw(OUT, t => {
        chD.style.transform = `translateX(${t * SH}px)`;
        chD.style.opacity = t > .4 ? Math.max(0, 1 - (t - .4) / .6) : 1;
      }),
      // Staggered reveal of each I+D letter
      ...idLetters.map(({ el }, i) =>
        after(i * 18, OUT, t => {
          el.style.opacity   = String(t);
          el.style.transform = `translateX(${-55 * (1 - t)}px)`;
        })
      ),
    ]);

    // Lock DANWOR as hidden
    chD.style.opacity = '0'; chNwor.style.opacity = '0'; chALambda.style.opacity = '0';
    idLetters.forEach(({ el }) => {
      el.style.opacity = '1'; el.style.transform = 'translateX(0)';
    });
    wId.style.pointerEvents = 'auto';

    // Phase 2: Hold INNOVACIÓN + DESARROLLO (~1.4s), then fire bullet
    await new Promise(r => setTimeout(r, 1400));

    // Fire bullet — kills letters as it passes, leaves I + D
    await fireBulletKill();

    // Phase 3: Hold I+D result briefly
    await new Promise(r => setTimeout(r, 900));

    // Phase 4: I+D → back to DANWOR
    chD.style.transform = `translateX(${SH}px)`; chD.style.opacity = '0';
    chNwor.style.opacity = '0'; chNwor.style.transform = 'translateX(14px)';
    chALambda.style.opacity = '0'; chALambda.style.transform = 'translateX(14px)';

    // Fade out remaining I+D letters while DANWOR comes back
    const keepLetters = idLetters.filter(l => l.role !== 'kill'); // I, +, D (and convert=I now)
    await Promise.all([
      // Fade out all visible letters
      tw(BACK, t => {
        idLetters.forEach(({ el }) => {
          if (parseFloat(el.style.opacity) > 0) el.style.opacity = String(1 - t);
        });
      }),
      after(75,  BACK, t => { chD.style.opacity = t; chD.style.transform = `translateX(${SH * (1-t)}px)`; }),
      after(130, BACK, t => {
        chNwor.style.opacity = t; chNwor.style.transform = `translateX(${14*(1-t)}px)`;
        chALambda.style.opacity = t; chALambda.style.transform = `translateX(${14*(1-t)}px)`;
      }),
    ]);

    wId.style.pointerEvents = 'none';
    cycle();
  }

  document.fonts.ready.then(() => {
    matchWidths();
    cycle();
  });
</script>
</body>
</html>
