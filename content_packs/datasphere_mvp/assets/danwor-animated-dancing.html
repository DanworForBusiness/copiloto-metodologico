  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    font-family: 'Source Sans 3', sans-serif;
  }

  .layout {
    display: flex;
    align-items: center;
    width: 100%;
    height: 100px;
    padding: 0 24px 0 0;
    gap: 0;
    position: relative;
    overflow: hidden;
  }

  .panel-left {
    flex: 0 0 auto;
    height: 100px;
    display: flex;
    align-items: center;
    position: relative;
    min-width: 240px;
    overflow: visible;
    padding-bottom: 6px;
  }

  .main-row {
    position: relative;
    height: 67px;
  }

  .word {
    position: absolute;
    top: 0; left: 0;
    display: flex;
    align-items: center;
    height: 80px;
    white-space: nowrap;
  }

  .ch {
    font-family: 'Metropolis', 'Arial Black', sans-serif;
    font-weight: 800;
    font-size: 40px;
    color: #363636;
    line-height: 1;
    letter-spacing: 2px;
    display: inline-block;
    will-change: transform, opacity;
  }
  .chA {
    font-family: 'Pirulen', 'Arial Black', sans-serif;
    font-weight: normal;
    font-size: 40px;
    color: #363636;
    line-height: 1;
    letter-spacing: 2px;
    display: inline-block;
    will-change: transform, opacity;
  }
  /* DANWOR letters use Pirulen */
  #wDan .ch {
    font-family: 'Pirulen', 'Arial Black', sans-serif;
    font-weight: normal;
  }

  #wId {
    opacity: 0;
    pointer-events: none;
  }
  #wId .ch {
    font-size: 40px;
    letter-spacing: 1px;
    transition: opacity 0.06s linear;
    transform-origin: center bottom; /* rotate from base like a person standing */
  }
  .gold { color: #EAB308; }

  .divider {
    width: 1px;
    height: 60px;
    background: #d0d0d0;
    margin: 0 28px;
    flex-shrink: 0;
    align-self: center;
  }

  .panel-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 0;
    position: relative;
    overflow: hidden;
  }

  .title-wrapper {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .title-line {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.2;
    color: #1a1a1a;
    letter-spacing: -0.2px;
    white-space: nowrap;
    display: flex;
    flex-wrap: nowrap;
    align-self: flex-start;
  }

  .subtitle-line {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 400;
    font-size: 16px;
    margin-top: 4px;
    color: #5e6166;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .title-line .tc {
    display: inline-block;
    position: relative;
    transition: none;
  }

  .subtitle-line .tcs {
    display: inline-block;
    opacity: 0.7;
  }

  .tc.lit {
    animation: charShimmer 0.55s ease-out forwards;
  }

  /* Shimmer para subtítulo — 90% más sutil, casi imperceptible */
  .tcs.lit-sub {
    animation: charShimmerSub 0.7s ease-out forwards;
  }

  @keyframes charShimmerSub {
    0%   { opacity: 1;   color: #5e6166; }
    35%  { opacity: 1;   color: #bbb; }
    100% { opacity: 0.7; color: #5e6166; }
  }

  @keyframes charShimmer {
    0%   { color: inherit;               text-shadow: none; }
    25%  { color: rgba(255,255,255,0.35); text-shadow: 0 0 6px rgba(255,207,0,0.07), 0 0 2px rgba(255,255,255,0.15); }
    55%  { color: rgba(200,180,0,0.6);  text-shadow: 0 0 3px rgba(255,207,0,0.05); }
    100% { color: inherit;               text-shadow: none; }
  }

  #bullet {
    position: fixed;
    top: 0; left: 0;
    font-family: 'Pirulen', sans-serif;
    font-weight: 700;
    font-size: 29px;
    color: rgba(255,207,0,0.7);
    opacity: 0;
    will-change: transform, opacity;
    z-index: 100;
    line-height: 1;
    text-shadow: 0 0 16px rgba(255,207,0,0.5);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="layout" id="layout">

  <div class="panel-left" id="panelLeft">
    <div class="main-row" id="mainRow">

      <div class="word" id="wDan">
        <span class="ch"  id="chD">D</span>
        <span class="chA" id="chALambda">A</span>

        <span class="ch" id="lR1"    style="opacity:0">r</span>
        <span class="ch" id="lR2"    style="opacity:0">r</span>
        <span class="ch" id="lO3"    style="opacity:0">o</span>

      <!-- Data & AI for Business — cae desde arriba, D e I vienen del I+D -->
      <div class="word" id="wDaib" style="opacity:0; pointer-events:none; position:absolute; top:0; left:0;">
        <span class="ch gold" id="dbD"  style="opacity:0">D</span>
        <span class="ch gold" id="dbAta" style="opacity:0">ata</span>
        <span class="ch gold" id="dbAmp" style="opacity:0">&nbsp;&amp;&nbsp;</span>
        <span class="ch gold" id="dbA"  style="opacity:0">A</span>
        <span class="ch gold" id="dbI"  style="opacity:0">I</span>
        <span class="ch gold" id="dbFor" style="opacity:0">&nbsp;for&nbsp;</span>
        <span class="ch gold" id="dbBiz" style="opacity:0">Business</span>
      </div>

    </div>
  </div>

  <div class="divider"></div>

  <div class="panel-right" id="panelRight">
    <div class="title-wrapper">
      <div class="title-line" id="titleLine"></div>
      <div class="subtitle-line" id="subtitleLine"></div>
    </div>
  </div>

</div>

<div id="bullet">&gt;</div>

<script>
  const chD       = document.getElementById('chD'),
        chNwor    = document.getElementById('chNwor'),
        chALambda = document.getElementById('chALambda'),
        wDan      = document.getElementById('wDan'),
        wId       = document.getElementById('wId'),
        wDaib     = document.getElementById('wDaib'),
        mainRow   = document.getElementById('mainRow'),
        bullet    = document.getElementById('bullet'),
        panelLeft = document.getElementById('panelLeft'),
        panelRight= document.getElementById('panelRight'),
        titleLine   = document.getElementById('titleLine'),

  // ── TWEEN UTILS ──
  const HOLD = 3000, OUT = 360, BACK = 420, SH = 50;
  const ease    = t => t < .5 ? 2*t*t : -1+(4-2*t)*t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn  = t => t * t * t;
  const sin01   = t => Math.sin(t * Math.PI);       // 0→1→0 arc
  const sin02   = t => Math.sin(t * Math.PI * 2);   // full sine wave

  const tw = (dur, fn) => new Promise(res => {
    const s = performance.now();
    (function f(n) {
      const t = ease(Math.min((n-s)/dur, 1));
      fn(t);
      t < 1 ? requestAnimationFrame(f) : res();
    })(performance.now());
  });
  const twRaw = (dur, fn) => new Promise(res => {
    const s = performance.now();
    (function f(n) {
      const t = Math.min((n-s)/dur, 1);
      fn(t);
      t < 1 ? requestAnimationFrame(f) : res();
    })(performance.now());
  });
  const after = (d, dur, fn) => new Promise(r => setTimeout(() => tw(dur,fn).then(r), d));

  // ── BULLET KILL — accepts optional pre-positioned start ──
  function fireBulletKill(prePositioned = false) {
    return new Promise(resolve => {
      const wIdRect   = wId.getBoundingClientRect();
      const rightRect  = panelRight.getBoundingClientRect();
      const titleRect  = titleLine.getBoundingClientRect();
      const fadeStartX = titleRect.right - 60;   // empieza a desvanecerse ~al inicio de "Danwor"
      const fadeEndX   = titleRect.right + 10;   // completamente invisible al salir del título
      const endX       = fadeEndX + 20;
      const topY      = wIdRect.top + wIdRect.height / 2;

      // If pre-positioned, bullet is already placed — read its current left
      const startX = prePositioned
        ? parseFloat(bullet.style.left)
        : wIdRect.left - 20;

      if (!prePositioned) {
        bullet.style.left      = startX + 'px';
        bullet.style.top       = topY + 'px';
        bullet.style.transform = 'translateY(-50%)';
        bullet.style.opacity   = '0';
      }

      const letterPositions = idLetters.map(({ el }) => {
        const r = el.getBoundingClientRect();
        return r.left + r.width / 2;
      });
      const processed = new Array(idLetters.length).fill(false);
      // Pre-mark AND instantly hide letters already behind bullet start
      // NEVER pre-process 'convert' — must always be handled live by the bullet
      letterPositions.forEach((pos, i) => {
        if (pos < startX && idLetters[i].role !== 'convert') {
          processed[i] = true;
          if (idLetters[i].role === 'kill') idLetters[i].el.style.opacity = '0';
        }
      });

      const BULLET_DUR  = prePositioned ? 500 : 600;
      let shimmerFired  = false;
      const s = performance.now();

      function frame(now) {
        const raw = (now - s) / BULLET_DUR;
        const t   = Math.min(raw, 1);
        const et  = t < 0.75 ? t / 0.75 : 1;
        const x   = startX + (endX - startX) * et;

        bullet.style.left = x + 'px';

        // Fade in rápido al arrancar, fade out suave al pasar el título
        let op;
        if (!prePositioned && t < 0.04) {
          op = t / 0.04;
        } else if (x >= fadeStartX) {
          // fade out 100% → 0 en 80px después del título
          op = Math.max(0, 1 - (x - fadeStartX) / (fadeEndX - fadeStartX));
        } else {
          op = 1;
        }
        bullet.style.opacity = op.toString();

        idLetters.forEach(({ el, role }, i) => {
          if (!processed[i] && x > letterPositions[i]) {
            processed[i] = true;
            if (role === 'kill') {
              el.style.opacity = '0';
            } else if (role === 'convert') {
              el.textContent = 'I';
              el.style.color = '#ffcf00';
              setTimeout(() => { el.style.color = '#363636'; }, 180);
            }
          }
        });

        if (!shimmerFired && x >= rightRect.left) {
          shimmerFired = true;
          shimmerTitle();
        }

        if (t < 1) requestAnimationFrame(frame);
        else { bullet.style.opacity = '0'; resolve(); }
      }
      requestAnimationFrame(frame);
    });
  }

  function shimmerTitle() {
    const chars = [...titleLine.querySelectorAll('.tc')];
    chars.forEach((el, i) => {
      setTimeout(() => {
        el.classList.remove('lit');
        void el.offsetWidth;
        el.classList.add('lit');
        el.addEventListener('animationend', () => el.classList.remove('lit'), { once: true });
      }, i * 36);
    });
  }

  function shimmerSubtitle(chars, stagger) {
    chars.forEach((el, i) => {
      setTimeout(() => {
        el.classList.remove('lit-sub');
        void el.offsetWidth;
        el.classList.add('lit-sub');

  }

  // ── THE DANCE ──
  // elI = the converted I, elPlus = +, elD = D
  // Each gets transform-origin: center bottom so they rotate from their feet
  async function dance() {
    // Ensure clean transform state at dance start
    [elI, elPlus, elD].forEach(el => {
      el.style.transformOrigin = 'center bottom';
      el.style.transform = 'translateX(0) translateY(0) rotate(0deg) scale(1)';
    });

    const DUR = 3000;
    // ACT 2 starts at t=0.22 → 660ms into dance
    // Dance ends at 3000ms, shimmer animation is 0.7s per char
    // Available time from jump = 3000 - 660 = 2340ms
    // SUBTITLE has 52 chars → stagger = (2340 - 700) / 52 ≈ 31ms
    const SUBTITLE_CHARS = [...subtitleLine.querySelectorAll('.tcs')];
    const ACT2_START_MS  = DUR * 0.22;          // 660ms
    const AVAILABLE_MS   = DUR - ACT2_START_MS - 700; // leave 700ms for last char anim
    const SUB_STAGGER    = Math.floor(AVAILABLE_MS / SUBTITLE_CHARS.length);
    let subtitleFired = false;

    // We'll run the whole dance as one continuous rAF loop
    // with named waypoints composing the choreography
    return new Promise(resolve => {
      const s = performance.now();

      function frame(now) {
        const t = Math.min((now - s) / DUR, 1);

        // Dispara shimmer subtítulo exactamente cuando empieza el salto (ACT 2)
        if (!subtitleFired && t >= 0.22) {
          subtitleFired = true;
          shimmerSubtitle(SUBTITLE_CHARS, SUB_STAGGER);
        }

        // ── PHASE timings (normalized 0-1) ──
        // 0.00 – 0.22  ACT 1: recognition — lean toward each other
        // 0.22 – 0.52  ACT 2: first step — I jumps, D leans back then forward
        // 0.52 – 0.80  ACT 3: trompo — each spins 360° on its own axis independently
        // 0.80 – 1.00  ACT 4: resolution — back to neutral, graceful

        let iX=0, iY=0, iR=0, iS=1;
        let pX=0, pY=0, pS=1;
        let dX=0, dY=0, dR=0, dS=1;

        // ── ACT 1: Recognition (0 → 0.22) ──
        if (t < 0.22) {
          const a = easeOut(t / 0.22);
          iR =  8 * sin01(a * 0.7);
          iY = -4 * sin01(a * 0.7);
          dR = -10 * sin01(a * 0.7);
          dY = -3  * sin01(a * 0.7);
          pS = 1 + 0.04 * sin01(a);

        // ── ACT 2: First step (0.22 → 0.52) ──
        } else if (t < 0.52) {
          const a = (t - 0.22) / 0.30;
          iY = -18 * sin01(a);
          iR =  12 * Math.sin(a * Math.PI * 1.5);
          iS =  1 + 0.05 * sin01(a);
          dR = -8 + 18 * sin01(a * 0.9);
          dX =  6 * sin01(a * 1.2);

        // ── ACT 3: Trompo (0.52 → 0.80) ──
        // Each letter spins 360° on its own axis — I spins first, D slightly delayed
        // transform-origin: center center for true axis spin (not pendulum)
        } else if (t < 0.80) {
          const a = (t - 0.52) / 0.28;

          // I spins: full 360 with a gentle float up during spin
          const iA = Math.min(a / 0.85, 1); // I starts immediately
          iR = 360 * easeOut(iA);
          iY = -10 * sin01(iA);

          // D spins: delayed start, slightly faster to finish together
          const dA = Math.max(0, Math.min((a - 0.15) / 0.85, 1));
          dR = 360 * easeOut(dA); // same direction — both spinning their own trompo
          dY = -10 * sin01(dA);

          // + pulses subtly while they spin
          pS = 1 + 0.05 * sin01(a * 2);
          pY = -3 * sin01(a);

        // ── ACT 4: Resolution (0.80 → 1.00) ──
        } else {
          const a  = (t - 0.80) / 0.20;
          const ae = ease(a);
          iR  = 360; // stay at 360 (= 0, full circle done)
          dR  = 360;
          iY  = 0;
          dY  = 0;
          pS  = 1;
          pY  = 0;
        }

        // Apply to elements
        // During trompo phase use center center origin so it spins on its own axis
        if (t >= 0.52 && t < 0.80) {
          elI.style.transformOrigin    = 'center center';
          elD.style.transformOrigin    = 'center center';
        } else {
          elI.style.transformOrigin    = 'center bottom';
          elD.style.transformOrigin    = 'center bottom';
        }
        elI.style.transform    = `translateX(${iX}px) translateY(${iY}px) rotate(${iR}deg) scale(${iS})`;
        elPlus.style.transform = `translateX(${pX}px) translateY(${pY}px) scale(${pS})`;
        elD.style.transform    = `translateX(${dX}px) translateY(${dY}px) rotate(${dR}deg) scale(${dS})`;

        if (t < 1) requestAnimationFrame(frame);
        else {
          // Clean up
          [elI, elPlus, elD].forEach(el => el.style.transform = 'translateX(0) translateY(0) rotate(0deg) scale(1)');
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  // ── DATA & AI FOR BUSINESS ACT ──
  async function actDaib() {
    const allDb = wDaib.querySelectorAll('.ch');

    // Scale to match DANWOR width
    wDaib.style.visibility = 'hidden';
    wDaib.style.opacity    = '0';
    wDaib.style.display    = 'flex';
    allDb.forEach(el => {
      el.style.visibility = 'visible';
      el.style.opacity    = '1';
      el.style.fontSize   = '40px';
      el.style.color      = '#363636';
    });
    const danworW = wDan.getBoundingClientRect().width;
    let lo = 8, hi = 80, mid, best = 20;
    for (let i = 0; i < 30; i++) {
      mid = (lo + hi) / 2;
      allDb.forEach(el => el.style.fontSize = mid + 'px');
      if (wDaib.getBoundingClientRect().width < danworW) lo = mid; else hi = mid;
      best = mid;
    }
    allDb.forEach(el => el.style.fontSize = best + 'px');
    wDaib.style.visibility = '';
    wDaib.style.left = '0px';

    // D and I are invisible placeholders — hold their space, never visible during fall
    dbD.style.visibility = 'hidden';
    dbI.style.visibility = 'hidden';
    [dbAta, dbAmp, dbA, dbFor, dbBiz].forEach(el => el.style.opacity = '1');

    // Capture fly targets before fall (layout stable, wDaib not yet translated)
    wDaib.style.opacity = '1';
    const elDRect = elD.getBoundingClientRect();
    const elIRect = elI.getBoundingClientRect();
    const dbDRect = dbD.getBoundingClientRect();
    const dbIRect = dbI.getBoundingClientRect();

    const dTravelX = dbDRect.left - elDRect.left;
    const dTravelY = dbDRect.top  - elDRect.top;
    const iTravelX = dbIRect.left - elIRect.left;
    const iTravelY = dbIRect.top  - elIRect.top;

    // ── ACT 1: Fall ──
    const FALL_DUR = 240;
    await tw(FALL_DUR, t => {
      wDaib.style.transform       = `translateY(${-80 * (1 - easeIn(t))}px)`;
      wDaib.style.transformOrigin = 'center bottom';
    });

    // ── ACT 2: D and I fly immediately on landing ──
    const FLY_DUR = 480;
    let dFlown = false, iFlown = false;

    await Promise.all([
      tw(FLY_DUR, t => {
        const arc = -40 * sin01(t);
        elD.style.transform = `translateX(${dTravelX * ease(t)}px) translateY(${dTravelY * ease(t) + arc}px)`;
        elD.style.opacity   = t > 0.92 ? String(1 - (t - 0.92) / 0.08) : '1';
        if (t >= 0.92 && !dFlown) { dFlown = true; dbD.style.visibility = 'visible'; }
      }),
      after(60, FLY_DUR, t => {
        const arc = -35 * sin01(t);
        elI.style.transform = `translateX(${iTravelX * ease(t)}px) translateY(${iTravelY * ease(t) + arc}px)`;
        elI.style.opacity   = t > 0.92 ? String(1 - (t - 0.92) / 0.08) : '1';
        if (t >= 0.92 && !iFlown) { iFlown = true; dbI.style.visibility = 'visible'; }
      }),
      tw(FLY_DUR * 0.6, t => { elPlus.style.opacity = String(1 - t); }),
    ]);

    elD.style.opacity = '0'; elI.style.opacity = '0'; elPlus.style.opacity = '0';

    // & pulsa como golpe eléctrico — encendido/apagado antes de iniciar el contagio
    const pulse = async () => {
      const beats = [1, 0, 1, 0, 1, 0, 1]; // un parpadeo más
      for (const on of beats) {
        dbAmp.style.color = on ? '#ffcf00' : '#363636';
        await new Promise(r => setTimeout(r, 80));
      }
    };
    await pulse();
    // & quedó en #ffcf00 — vira a #EAB308 durante el respiro
    tw(120, t => { dbAmp.style.color = lerpColorContagion(t); });

    // Respiro breve — el & quedó encendido, ahora arranca el contagio
    await new Promise(r => setTimeout(r, 120));

    // Contagio: gold se propaga desde & hacia afuera, letra a letra
    // Cada letra arranca en #ffcf00 (eléctrico) y vira a #EAB308 (legible) en 400ms
    function lerpColorContagion(t) {
      const r = Math.round(255 + (234 - 255) * t);
      const g = Math.round(207 + (179 - 207) * t);
      const b = Math.round(0   + (8   - 0  ) * t);
      return `rgb(${r},${g},${b})`;
    }
    const contagionOrder = [dbA, dbI, dbAta, dbD, dbFor, dbBiz];
    for (const el of contagionOrder) {
      await new Promise(r => setTimeout(r, 90));
      el.style.color = '#ffcf00';
      // Animate this letter from #ffcf00 → #EAB308 over 400ms (non-blocking)
      tw(400, t => { el.style.color = lerpColorContagion(t); });
    }

    // ── ACT 3: Hold ──
    await new Promise(r => setTimeout(r, 2200));

    // ── ACT 4: Fade out ──
    await tw(300, t => { wDaib.style.opacity = String(1 - t); });
    wDaib.style.opacity   = '0';
    wDaib.style.display   = 'none';
    wDaib.style.transform = '';

    elI.style.transform = ''; elD.style.transform = ''; elPlus.style.transform = '';
    elI.style.opacity = '0'; elD.style.opacity = '0'; elPlus.style.opacity = '0';
  }

  // ── MAIN CYCLE ──
  async function cycle() {
    reset();
    await new Promise(r => setTimeout(r, HOLD));

    // Ʌ vira a gold ANTES de que arranque el colapso — DɅNWOR completo visible con Ʌ dorado
    await tw(200, t => {
      chALambda.style.color = t < 1 ? lerpColor(t) : '#ffcf00';
    });
    // Asegurar color exacto
    chALambda.style.color = '#ffcf00';
    // Pausa para que se lea DɅNWOR con Ʌ en gold
    await new Promise(r => setTimeout(r, 300));

    // ── DANWOR → INNOVACIÓN + DESARROLLO ──
    // Ʌ rotates to > and turns gold during the collapse, then becomes the bullet
    requestAnimationFrame(() => { wId.style.opacity = '1'; });

    // Interpolate color from #363636 to #ffcf00
    function lerpColor(t) {
      const r = Math.round(0x36 + (0xc9 - 0x36) * t);
      const g = Math.round(0x36 + (0x96 - 0x36) * t);
      const b = Math.round(0x36 + (0x0a - 0x36) * t);
      return `rgb(${r},${g},${b})`;
    }

    await Promise.all([
      // NWOR fades out to the right
      tw(OUT, t => {
        chNwor.style.opacity   = 1 - t;
        chNwor.style.transform = `translateX(${t * 14}px)`;
      }),
      // D shifts and fades
      tw(OUT, t => {
        chD.style.transform = `translateX(${t * SH}px)`;
        chD.style.opacity   = t > .4 ? Math.max(0, 1-(t-.4)/.6) : 1;
      }),
      // Ʌ rotates +90deg (∧ → >) turning gold only in the last 20% while still readable
      tw(OUT, t => {
        const rot = 90 * ease(t);
        const tx  = 8 * t;
        const colorT = 1; // ya está en gold desde antes
        chALambda.style.transformOrigin = 'center center';
        chALambda.style.transform = `translateX(${tx}px) rotate(${rot}deg)`;
        const alpha = 1 - (0.3 * ease(t)); // 1.0 → 0.7 durante la rotación
        chALambda.style.color = `rgba(255,207,0,${alpha.toFixed(3)})`;
        chALambda.style.opacity  = '1';
        chALambda.style.fontSize = `${40 + (28 - 40) * ease(t)}px`;
      }),
      // I+D letters staggered reveal — but we DON'T wait for this, bullet fires mid-reveal
      ...idLetters.map(({ el }, i) =>
        after(i * 18, OUT, t => {
          el.style.opacity   = String(t);
          el.style.transform = `translateX(${-55*(1-t)}px)`;
        })
      ),
    ]);

    // Lock DANWOR hidden
    chD.style.opacity = '0'; chNwor.style.opacity = '0';
    idLetters.forEach(({ el }) => {
      el.style.opacity = '1'; el.style.transform = 'translateX(0)';
    });
    wId.style.pointerEvents = 'auto';

    // Un flash de > antes del impulso — apenas perceptible
    await new Promise(r => setTimeout(r, 60));

    // Pausa con > dorado visible — 600ms
    await new Promise(r => setTimeout(r, 600));

    // Slingshot: > dashes left quickly, then launches right
    // Phase 1 (0→0.35): pull left
    // Phase 2 (0.35→1): accelerate right past original position
    const SLING_DUR = 60;
    const baseX = 8;
    const pullX = -6;
    await tw(SLING_DUR, t => {
      let x;
      if (t < 0.35) {
        // Pull left — fast
        const a = t / 0.35;
        x = baseX + (pullX - baseX) * easeOut(a);
      } else {
        // Launch right — accelerating
        const a = (t - 0.35) / 0.65;
        x = pullX + (baseX + 120 - pullX) * easeIn(a); // overshoots right edge
      }
      chALambda.style.transform = `translateX(${x}px) rotate(90deg)`;
    });

    // ── HANDOFF: Ʌ becomes the bullet seamlessly ──
    const lambdaRect   = chALambda.getBoundingClientRect();
    const rightRect    = panelRight.getBoundingClientRect();
    const bulletStartX = lambdaRect.left;
    const bulletY      = lambdaRect.top  + lambdaRect.height / 2;

    chALambda.style.opacity = '0';

    bullet.style.left      = bulletStartX + 'px';
    bullet.style.top       = bulletY + 'px';
    bullet.style.transform = 'translateY(-50%)';
    bullet.style.opacity   = '1';

    // No extra pause — bullet is already mid-launch, continue immediately
    await new Promise(r => setTimeout(r, 0));

    // Bullet fires from Ʌ position — already pre-positioned and visible
    await fireBulletKill(true);

    // Brief breath before the dance
    await new Promise(r => setTimeout(r, 400));

    // ── THE DANCE ──
    await dance();

    // Brief pause after dance
    await new Promise(r => setTimeout(r, 300));

    // ── DATA & AI FOR BUSINESS ──
    await actDaib();

    // I+D → back to DANWOR
    chD.style.transform      = `translateX(${SH}px)`; chD.style.opacity = '0';
    chNwor.style.opacity     = '0'; chNwor.style.transform = 'translateX(14px)';
    chALambda.style.opacity  = '0';
    chALambda.style.transform = 'translateX(14px) rotate(0deg)';
    chALambda.style.color    = '#363636';
    chALambda.style.fontSize = '40px';

    await Promise.all([
      tw(BACK, t => {
        idLetters.forEach(({ el }) => {
          if (parseFloat(el.style.opacity) > 0) el.style.opacity = String(1-t);
        });
      }),
      after(75,  BACK, t => { chD.style.opacity = t; chD.style.transform = `translateX(${SH*(1-t)}px)`; }),
      after(130, BACK, t => {
        chNwor.style.opacity = t; chNwor.style.transform = `translateX(${14*(1-t)}px)`;
        chALambda.style.opacity = t; chALambda.style.transform = `translateX(${14*(1-t)}px) rotate(0deg)`;
      }),
    ]);

    wId.style.pointerEvents = 'none';
    cycle();
  }

  document.fonts.ready.then(() => {
    matchWidths();
    // Logo asentado, sin la animación de entrada (se replicaba en cada navegación
    // SSR al recargar el iframe). reset() deja el estado de reposo: DANWOR + claim
    // visibles, sin el morph. Para restaurar la animación: volver a `cycle();`.
    reset();
  });
</script>
