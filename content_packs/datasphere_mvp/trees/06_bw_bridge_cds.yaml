id: m06_bw_bridge_cds
title: BW Bridge o CDS Views
version: "0.1"

# Links como navigation bindings (para UI / conexión con módulos)
links:
  module: 06_Troubleshooting_y_Performance
  topics: ["bw_bridge", "adso_cdc"]

# Tags taxonomy / Concepts (para búsqueda, agrupación, KG futuro)
tags: ["M06", "troubleshooting", "bw-bridge", "cds"]

# Keywords en lenguaje natural para intent detection del asistente.
keywords: [
  "BW Bridge vs CDS", "BW bridge o CDS", "cuándo usar BW Bridge", "cuando usar BW Bridge",
  "cuándo usar CDS en lugar de BW Bridge", "BW bridge o CDS view",
  "árbol BW Bridge", "arbol BW Bridge", "decisión BW Bridge",
  "extractor BW Bridge datasphere", "tabla BW Bridge",
  "importar desde BW Bridge", "ampliar BW Bridge",
  "ADSO datasphere", "extractor estándar BW Bridge",
  "desarrollo BW Bridge o datasphere", "dónde desarrollar BW Bridge"
]

exclude_if: [
  "codigo", "código", "template", "ejemplo", "ayudame con el codigo",
  "como hago", "como escribo", "escribir", "generar codigo", "crearme",
  "dame un", "mostrame", "sample", "snippet"
]

start: q1

nodes:
  q1:
    type: single_choice
    question: "¿El origen de datos (tabla o extractor) ya existe en el BW Bridge?"
    options: ["Sí", "No"]
    next:
      "Sí": q2_combinar
      "No": q3_extractor_std

  q2_combinar:
    type: single_choice
    question: "¿Se requiere integrar o combinar los datos con modelos ya existentes en el BW Bridge?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_bw_bridge_ampliar
      "No": leaf_bw_bridge_capitalizar

  q3_extractor_std:
    type: single_choice
    question: "¿Existe un extractor estándar (ODP-SAPI whitelisted o CDS) disponible para el caso?"
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": leaf_cds_directo
      "No": leaf_cds_custom
      "No sé": leaf_investigar

leaves:
  leaf_bw_bridge_ampliar:
    decision: "Ampliar el modelo existente en el BW Bridge — el origen ya existe y hay dependencias con modelos BW Bridge."
    notes:
      - "Mantener la cohesión del modelo dentro del BW Bridge evita fragmentación."
      - "Las relaciones y jerarquías existentes en el Bridge son más fáciles de mantener juntas."
    post_actions:
      mode: resolved
      next_steps:
        - "Ampliar el InfoProvider o ADSO existente en el BW Bridge"
        - "Verificar si el ADSO es Standard Type con Write Change Log para habilitar CDC"
        - "Importar la entidad resultante a Datasphere via integración nativa"

  leaf_bw_bridge_capitalizar:
    decision: "Capitalizar el extractor estándar a través del BW Bridge — el origen existe y no hay dependencias cruzadas."
    notes:
      - "Si el extractor BW Bridge ya está activo y soportado, es el camino más directo."
      - "Verificar compatibilidad delta del extractor antes de usar en producción."
    post_actions:
      mode: llm_value_add

  leaf_cds_directo:
    decision: "Crear CDS View e importar directamente a Datasphere — no hay dependencias con modelos BW Bridge existentes."
    notes:
      - "La CDS View es más limpia y future-proof que pasar por el BW Bridge cuando no hay dependencias."
      - "Incluir @Analytics.dataExtraction.delta.changeDataCapture.automatic: true si el extractor no define delta propio."
      - "Verificar compatibilidad de anotaciones con Datasphere antes de importar."
    post_actions:
      mode: resolved
      next_steps:
        - "Verificar si la CDS estándar cubre el caso o si requiere adaptación"
        - "Incluir anotaciones mínimas de extracción compatibles con Datasphere"
        - "Importar como tabla remota y validar compatibilidad delta"

  leaf_cds_custom:
    decision: "Crear CDS View custom con template Danwor — no existe extractor estándar soportado para este caso."
    notes:
      - "Usar el template ZCDS_DWC_DIM_TEMPLATE como base."
      - "Definir el mecanismo delta desde el diseño: byElement (timestamp) o CDC (changeDataCapture)."
      - "Documentar por qué no hay extractor estándar disponible."
    post_actions:
      mode: llm_value_add

  leaf_investigar:
    decision: "Investigar disponibilidad de extractor antes de decidir — sin esta información el camino puede cambiar significativamente."
    notes:
      - "Revisar el SAP Business Accelerator Hub para CDS disponibles."
      - "Verificar la Nota SAP 2500202 para ODP-SAPI whitelisted del caso."
      - "Si hay extractor BW Bridge activo y soportado, evaluarlo como primera opción."
    post_actions:
      mode: needs_human_review
      reason: "Disponibilidad de extractor estándar desconocida — verificar antes de comprometer el enfoque de desarrollo"

capture_uncharted:
  type: free_capture
  prompt: "Describí brevemente tu contexto de integración con BW Bridge"
  fields:
    - id: context_description
      label: "¿Qué origen de datos querés integrar y en qué arquitectura?"
      required: true
    - id: decision_taken
      label: "¿BW Bridge o CDS directo?"
      required: false
    - id: outcome
      label: "¿Cómo resultó?"
      type: select
      options: ["anduvo", "no anduvo", "inconcluso", "en curso", "no lo sé"]
      required: true
