id: m10_decision_paradigma
title: Decisión de Paradigma Arquitectónico
version: "0.1"

# Links como navigation bindings (para UI / conexión con módulos)
links:
  module: 10_Fundamentos_EA_y_Paradigmas
  topics: ["paradigmas", "ea"]

# Tags taxonomy / Concepts (para búsqueda, agrupación, KG futuro)
tags: ["M10", "ea", "architecture", "paradigms"]

# Keywords en lenguaje natural para intent detection del asistente.
keywords: [
  "paradigma arquitectónico", "paradigma arquitectonico",
  "qué paradigma usar", "que paradigma usar",
  "data warehouse", "lakehouse", "data mesh", "data fabric",
  "cuándo usar lakehouse", "cuando usar lakehouse",
  "cuándo usar data mesh", "cuando usar data mesh",
  "cuándo usar data fabric", "cuando usar data fabric",
  "decisión paradigma", "decision paradigma",
  "árbol paradigma", "arbol paradigma",
  "arquitectura híbrida", "arquitectura hibrida",
  "dominios autónomos datos", "dominios autonomos datos",
  "multi-cloud datos", "federar sin mover datos",
  "datos semiestructurados arquitectura", "ML arquitectura datos",
  "reporting crítico paradigma", "KPIs arquitectura",
  "warehouse vs lakehouse", "mesh vs fabric"
]

# exclude_if: palabras de intención operacional
exclude_if: [
  "codigo", "código", "template", "ejemplo", "ayudame con el codigo",
  "como hago", "como escribo", "escribir", "generar codigo", "crearme",
  "dame un", "mostrame", "sample", "snippet"
]

start: q1

nodes:
  q1:
    type: single_choice
    question: "¿El caso requiere reporting confiable, regulatorio o KPIs críticos de negocio (financiero, inventario, auditoría)?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_warehouse_lakehouse
      "No": q2_exploracion

  q2_exploracion:
    type: single_choice
    question: "¿Requiere exploración de datos, Machine Learning, granularidad masiva o datos semiestructurados/no estructurados?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_datalake_lakehouse
      "No": q3_dominios

  q3_dominios:
    type: single_choice
    question: "¿El caso involucra múltiples dominios de negocio con equipos distintos y ownership distribuido de los datos?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_data_mesh
      "No": q4_multicloud

  q4_multicloud:
    type: single_choice
    question: "¿El landscape es híbrido o multi-cloud y no es posible (o deseable) mover los datos de su origen?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_data_fabric
      "No": leaf_warehouse_lakehouse

leaves:
  leaf_warehouse_lakehouse:
    decision: "Data Warehouse / Lakehouse tabular — base predeterminada en SAP Datasphere para reporting gobernado y KPIs de negocio."
    notes:
      - "Modelado por capas (ingesta → armonización → propagación → consumo)."
      - "Tablas persistentes donde el volumen o rendimiento lo requiera."
      - "Modelos analíticos con semántica SAP, DAC para seguridad granular."
      - "Compatible por construcción con la evolución hacia BDC."
    post_actions:
      mode: resolved
      next_steps:
        - "Definir los dominios de datos y sus data products"
        - "Aplicar arquitectura por capas (módulo 04)"
        - "Diseñar la estrategia de persistencia vs. federación (módulo 03)"

  leaf_datalake_lakehouse:
    decision: "Data Lake / Lakehouse — complementar Datasphere con un data lake externo (HDFS/S3) para exploración, ML o datos no estructurados."
    notes:
      - "Datasphere actúa como capa de gobierno y consumo estructurado."
      - "El data lake externo (o Lakehouse BDC) almacena archivos crudos, históricos y datos semiestructurados."
      - "Integrar ambos mediante Data Flows o el conector BDC según disponibilidad."
    post_actions:
      mode: llm_value_add

  leaf_data_mesh:
    decision: "Data Mesh sobre Datasphere — espacios por dominio con ownership distribuido, data products publicados hacia Cross-Sharing."
    notes:
      - "Cada dominio gestiona su propio espacio y publica data products al espacio de Cross-Sharing/Gobierno."
      - "Los data products son el contrato entre dominios — no compartir objetos internos entre espacios."
      - "Requiere gobernanza centralizada del catálogo y estándares de naming/semántica comunes."
    post_actions:
      mode: llm_value_add

  leaf_data_fabric:
    decision: "Data Fabric — federación y virtualización para acceder a datos en su origen sin replicarlos, con catálogo unificado y linaje."
    notes:
      - "Tablas remotas (federación) como mecanismo principal — los datos no se mueven."
      - "Catálogo unificado para descubrimiento cross-system."
      - "Trade-off: performance limitada por la disponibilidad y capacidad del sistema origen."
      - "Evaluar el impacto en el sistema fuente antes de escalar."
    post_actions:
      mode: llm_value_add

capture_uncharted:
  type: free_capture
  prompt: "Describí brevemente el caso arquitectónico"
  fields:
    - id: context_description
      label: "¿Qué necesidad arquitectónica está intentando resolver?"
      required: true
    - id: decision_taken
      label: "¿Qué paradigma o combinación elegiste?"
      required: false
    - id: outcome
      label: "¿Cómo resultó?"
      type: select
      options: ["anduvo", "no anduvo", "inconcluso", "en curso", "no lo sé"]
      required: true
