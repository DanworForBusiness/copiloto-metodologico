id: resolucion_contrato
title: Resolución de Contrato
version: "0.1"
#Links como navigation bindings (para UI / conexión con módulos)
#módulo | topic (key_topic)
links:
  module: 03_Integracion_y_Estrategia_de_Datos
  topics: ["contrato de datos", "modelo danwor"]
#Tags taxonomy / Concepts (para búsqueda, agrupación, KG futuro)
# concepts responde: ¿De qué trata este árbol?
tags: ["M03", "contrato de datos", "modelo danwor"]  
# Keywords en lenguaje natural para intent detection del asistente.
# Responde: ¿Cómo preguntaría un consultor sobre este árbol?
keywords: [
  "data contract", "contrato", "contrato de dato", "contrato de datos", "producto de datos", "data product", "data products"
]
# exclude_if[]: palabras de intención operacional (pedir código/template/ejemplo)
# que indican que el usuario quiere HACER algo, no DECIDIR algo.
# Si la pregunta contiene alguna → este árbol no se ofrece.

start: q1
nodes:
  q1:
    type: single_choice
    question: "¿La fuente de origen puede resolver el contrato sin comprometer CDC?"
    options: ["Sí", "No"]
    next:
      "Sí": q2_vol
      "No": q2_min_contract

  q2_min_contract:
    type: single_choice
    question: "¿El origen puede al menos entregar estructura estable y semántica base?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_contrato_parcial_origen
      "No": q3_extr_robusto
      

  q3_extr_robusto:
    type: single_choice
    question: "¿El origen solo puede actuar como extractor robusto?"
    options: ["Sí", "No"]
    next:
      "Sí": leaf_extr_robusto_origen
      "No": leaf_contract_intervention

leaves:
  leaf_contrato_origen: 
    decision: "Contrato Resuelto en Origen"
    post_actions: 
      mode: resolved
      next_steps:
        - "Cuando la complejidad del contrato es baja, se recomienda resolver el contrato en el origen mismo."

  leaf_contrato_parcial_origen: 
    decision: "Contrato Parcial en Origen + 2V* en Datasphere"
    post_actions: 
      mode: resolved
      next_steps:
        - "Se resuelve lo que se pueda en el origen, y se complementa con la capa 2V en Datasphere"

  leaf_extr_robusto_origen: 
    decision: "Extractor Robusto en Origen"
    post_actions: 
      mode: resolved
      next_steps:
        - "Se aborda únicamente como API Corporativa de extracción y completa el contrato completo en Datasphere."

  leaf_contract_intervention: 
    decision: "Requiere revisión Arquitectónica para resolver Gobierno y excepción controlada"
    post_actions: 
      mode: needs_human_review
      reason: "Salida de Arbol no contemplada"

capture_uncharted:
  type: free_capture
  prompt: "Describí brevemente tu contexto técnico"
  fields:
    - id: context_description
      label: "¿Qué caracteriza tu caso?"
      required: true
    - id: decision_taken
      label: "¿Qué decidiste hacer?"
      required: false
    - id: outcome
      label: "¿Cómo resultó?"
      type: select
      options: ["anduvo", "no anduvo", "inconcluso", "en curso", "no lo sé"]
      required: true