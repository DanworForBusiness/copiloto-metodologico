# Novedades del Copiloto — LA fuente de publicación (no "la fuente manual").
#
# El copiloto SOLO lee este archivo: nunca lo sobrescribe ni borra. Append-only:
# agregá entradas arriba; no hace falta tocar nada más.
#
# CAMBIO DESPLEGADO != NOVEDAD PUBLICADA. Antes esto se fusionaba con los commits
# que llevaban un trailer `Novedad:`, leídos sobre TODO el repositorio — y como el
# monolito tiene Comercial, Reporting, Staffing y plataforma, terminó anunciando
# como novedad del Copiloto un fix de autenticación del Hub. Que un commit exista,
# esté en main o sea técnicamente importante NO lo vuelve elegible: publicar es una
# decisión editorial y se toma acá.
#
# Estructura de cada entrada (tags que el copiloto entiende):
#   ref:       código corto y ESTABLE — aparece en dorado, como el hash de commit. Único.
#   fecha:     YYYY-MM-DD — ordena las novedades (la más nueva arriba dispara el banner).
#   titulo:    descripción del cambio (header de la sección).
#   categoria: para el filtro (p. ej. Arquitectura, Conectividad, Seguridad, Integración,
#              Modelado, Reporting, Gobernanza, General). Libre; el filtro se arma solo.
#   detalle:   resumen breve (subtítulo `>`). Opcional.
#   cta:       texto del acceso directo (opcional; por defecto "Ir al contenido").
#   link:      acceso directo al material/contenido (opcional). Interno (/modules/...)
#              abre en la misma vista; externo (http...) en pestaña nueva. Se puede
#              sumar `&tab=catalogo` (o tree/section/assistant) para abrir el módulo
#              ya posicionado en esa pestaña del panel derecho.
#
# `ref` tiene que ser único y estable: es lo que la cookie `dw-whatsnew-seen`
# recuerda como "último anuncio visto". Cambiarlo re-dispara el banner.

