id: extraction_options
title: Opciones de Extracción
version: "0.1"
#Links como navigation bindings (para UI / conexión con módulos)
#módulo | topic (key_topic)
links:
  module: 03_Integracion_y_Estrategia_de_Datos
  topics: ["extraccion", "gobernanza"]
#Tags taxonomy / Concepts (para búsqueda, agrupación, KG futuro)
# concepts responde: ¿De qué trata este árbol?
tags: ["M03", "integration", "extraction"]  
# Keywords en lenguaje natural para intent detection del asistente.
# Responde: ¿Cómo preguntaría un consultor sobre este árbol?
keywords: [
  "extraccin", "extraer", "extraigo", "opciones de extraccion",
  "sistema fuente", "fuente de datos",
  "ECC", "S4", "S/4", "S/4HANA", "S4HANA", "BW",
  "CDS", "ODP", "ODP-SAPI", "DataSource", "extractor",
  "whitelisted", "whitelist", "Nota 2500202",
  "integrar", "integracion", "conectar", "replicar", 
  "Datasphere", "datasphere", "ABAP", "Netweaver", "NW7.5"
]
# exclude_if: palabras de intención operacional (pedir código/template/ejemplo)
# que indican que el usuario quiere HACER algo, no DECIDIR algo.
# Si la pregunta contiene alguna → este árbol no se ofrece.
exclude_if: [
  "Codigo", "codigo", "template", "ejemplo", "ayudame con el codigo",
  "como hago", "como escribo", "escribir", "generar codigo", "crearme",
  "dame un", "mostrame", "sample", "snippet"
]
start: q1
nodes:
  q1:
    type: single_choice
    question: "¿Cuál es el sistema fuente?"
    options: ["ERP", "BW"]
    next:
      ERP: q2_erp_version
      BW: q2_bw_inversion

  q2_erp_version:
    type: single_choice
    question: "¿Qué versión?"
    options: ["S4HANA", "ECC"]
    next:
      ECC: q3_ecc_odp
      S4HANA: q3_s4_edition

  # ECC: primero el contrato estándar autorizado (ODP-SAPI), independiente del umbral NW 7.5 del framework CDS.
  q3_ecc_odp:
    type: single_choice
    question: "¿Hay un extractor ODP-SAPI estándar autorizado que cubra el requerimiento?"
    help: "Autorizado significa liberado o whitelisted para ODP. Esta pregunta no depende del umbral NW 7.5, que aplica al framework CDS."
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": q4_ecc_odp_compat
      "No": q3_ecc_version
      "No sé": leaf_intervention

  q4_ecc_odp_compat:
    type: single_choice
    question: "¿Está comprobada la compatibilidad técnica para integrarlo?"
    help: "Revisá origen, conexión, versión, add-on DMIS y notas SAP aplicables al mecanismo previsto. Elegí «Pendiente / No sé» si falta configurar o evidenciar algo."
    options: ["Sí", "Incompatibilidad documentada", "Pendiente / No sé"]
    next:
      "Sí": leaf_odp_std
      "Incompatibilidad documentada": q3_ecc_version
      "Pendiente / No sé": leaf_intervention

  q3_ecc_version:
    type: single_choice
    question: "¿Qué versión de ABAP tiene el ECC?"
    help: "La versión de NetWeaver define si se puede usar el framework CDS."
    options: ["≥NW7.5", "Inferior", "No sé"]
    next:
      "≥NW7.5": leaf_ecc_framework
      "Inferior": leaf_ecc_investigation
      "No sé": leaf_intervention

  q3_s4_edition:
    type: single_choice
    question: "¿Qué edición de S/4HANA es?"
    options: ["Private", "Public"]
    next:
      Private: q4_s4_api_auth
      Public: q4_s4_api_rel

  q4_s4_api_auth:
    type: single_choice
    question: "¿Hay una API funcional SAP autorizada para el caso?"
    help: "Por ejemplo, una CDS estándar o un extractor ODP-SAPI whitelisted."
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": q5_cds_cumple
      "No": leaf_api_corp_wrap_tabla
      "No sé": leaf_intervention

  q4_s4_api_rel:
    type: single_choice
    question: "¿Hay una API SAP liberada para el caso?"
    help: "Por ejemplo, una CDS Released, el escenario SAP_COM_0532 o ABAP SQL."
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": q5_api_cumple
      "No": q5_api_ext      
      "No sé": leaf_intervention

  q5_cds_cumple:
    type: single_choice
    question: "¿Cumple el requerimiento funcional?"
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": q6_cds_compat
      "No": leaf_api_corp_wrap_func
      "No sé": leaf_intervention

  q5_api_cumple:
    type: single_choice
    question: "¿Cumple el requerimiento funcional?"
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": leaf_api_libe_contrato
      "No": q5_api_ext
      "No sé": leaf_intervention

  q5_api_ext:
    type: single_choice
    question: "¿SAP permite extenderla?"
    help: "Extensibilidad habilitada por SAP para esa API."
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": leaf_api_ext
      "No": leaf_api_not_supported
      "No sé": leaf_intervention

  q6_cds_compat:
    type: single_choice
    question: "¿Es técnicamente apta para consumirla desde Datasphere?"
    help: "Revisá delta, performance y compatibilidad con Datasphere. Si es una CDS, también anotaciones y asociaciones."
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": leaf_api_corp_contrato
      "No": leaf_api_corp_wrap_func
      "No sé": leaf_intervention

  q2_bw_inversion:
    type: single_choice
    question: "¿Los DataSources o extractores BW actuales siguen siendo valiosos para el caso?"
    help: "Valor funcional vigente: uso real, criticidad y reglas de negocio consolidadas reutilizables, no la inversión histórica. Alineado con la Matriz Técnica del apéndice A02."
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": q_bw_whitelist
      "No": leaf_alternatives
      "No sé": leaf_bw_valor_revision

  q_bw_whitelist:
    type: single_choice
    question: "¿Esos extractores están liberados para ODP y son técnicamente compatibles con el mecanismo previsto?"
    help: "«Sí» acredita las dos cosas: la liberación/autorización para ODP (Nota SAP 2500202) y la compatibilidad técnica con el mecanismo previsto (conexión, versión, add-on DMIS, notas). La whitelist por sí sola no garantiza ni la integración ni la capacidad delta. Elegí «Parcialmente» si solo algunos extractores califican."
    options: ["Sí", "Parcialmente", "No", "No sé"]
    next:
      "Sí": leaf_bw_whitelisted
      "Parcialmente": leaf_bw_puente
      "No": leaf_alternatives
      "No sé": leaf_bw_compat_revision

leaves:
  leaf_ecc_investigation: 
    decision: "No contamos con experiencia previa integrando una versión ECC tan antigua"
    post_actions: 
      mode: llm_value_add
      prompt_profile: "danwor_reco"
      questions:
        - "¿Es compatible el framework CDS (Core Data Services) en ECC 6.0 con versión ABAP inferior a Netweaver 7.5?"
        - "¿Es factible provisionar un SLT para la réplica de datos de tablas base?"
        - "¿Es viable para integración con SAP Datasphere?"

  leaf_ecc_framework: 
    decision: "Apoyarse en Framework CDS con vistas/wrapper custom compatibles con futuro upgrade."
    post_actions: 
      mode: resolved
      next_steps:
        - "Crear vista CDS Z como API de Integración"
        - "Incluir las anotaciones mínimas compatibles"
    notes:
      - "En esta instancia la CDS será compatible para extracción únicamente en modo FULL"

  leaf_intervention: 
    decision: "No contamos con información suficiente para una decisión sin intervención"
    post_actions: 
      mode: needs_human_review
      reason: "No indica contexto técnico suficiente"

  leaf_api_corp_wrap_tabla:
    decision: "API Corporativa: Apoyada en CDS Custom para encapsular tablas base"
    post_actions:
      mode: llm_value_add

  leaf_api_corp_wrap_func:
    decision: "API Corporativa: Apoyada en CDS Custom para encapsular la API functional y corregir limitaciones tecnicas, adaptar semantica o estabilizar consumo."
    post_actions:
      mode: llm_value_add

  leaf_api_corp_contrato:
    decision: "API Estándar"
    # `detail`: cuerpo explicativo con mini-markup seguro (ver filtro `leaf_markup`
    # en wizard.py). El único link permitido es `[label](https://…)` — acá el
    # texto visible "I_DataExtractionEnabledView" queda clickeable hacia SAP Help.
    detail: "El contrato se define en SAP mediante una API estándar. Si fuera un extractor SAPI-ODP, se consume directamente; si fuera una CDS View estándar, debe estar habilitada para extracción en [I_DataExtractionEnabledView](https://help.sap.com/docs/SAP_S4HANA_CLOUD/c0c54048d35849128be8e872df5bea6d/870d66c6bfc44d6c9f128c888f0c7957.html?locale=en-US) o, de lo contrario, crear una API Corporativa apoyada en la API funcional. Cuando no es posible, el contrato se define en Datasphere."
    post_actions:
      mode: llm_value_add

  leaf_api_libe_contrato:
    decision: "Consumir API SAP Liberada: El contrato se define en Datasphere."
    post_actions:
      mode: llm_value_add

  leaf_cds_template:
    decision: "Copiar CDS existente o crear una nueva usando el template Danwor (adaptar anotaciones compatibles con Datasphere)."
    post_actions:
      mode: llm_value_add

  leaf_api_ext:
    decision: "API SAP Extendida: Contrato definido en Datasphere."
    post_actions:
      mode: llm_value_add

  leaf_api_not_supported:
    decision: "Escenario no soportado."
    post_actions:
      mode: llm_value_add      

  leaf_odp_std:
    decision: "Apoyarse en extractor ODP-SAPI estándar whitelisted."
    notes:
      - "La compatibilidad del extractor depende del origen, la conexión, el add-on DMIS y las notas ODP, no del umbral NW 7.5 del framework CDS."
      - "En el escenario de Replication Flow, SAP Help indica DMIS 2011 SP23+, 2018 SP08+ o 2020 SP04+ con las notas listadas (verificar con Note Analyzer); otros mecanismos de consumo pueden tener prerrequisitos distintos."
      - "Validar la capacidad delta del extractor, la semántica de los cambios que entrega y cómo se persisten forma parte de la evaluación del contrato: que haya delta no garantiza la integridad del resultado (ver Extracción vía API Corporativa)."
    post_actions:
      mode: llm_value_add

  leaf_alternatives:
    decision: "Modernizar el contrato de extracción: evaluar CDS estándar, CDS custom u otra interfaz autorizada, según corresponda."
    notes:
      - "Aplica cuando los extractores BW ya no aportan valor funcional vigente o no son técnicamente compatibles: no se reutilizan extractores sin valor ni sin compatibilidad acreditada."
      - "No se impone una tecnología única; la interfaz de modernización se elige por contrato autorizado según el caso. Remite al árbol «Alcance de Modernización BW» (apéndice A02)."
    post_actions:
      mode: llm_value_add

  leaf_bw_puente:
    decision: "Compatibilidad parcial: evaluar una transición híbrida que reutilice solo los extractores BW liberados y compatibles mientras se modernizan los demás."
    notes:
      - "La compatibilidad parcial habilita evaluar esta estrategia, no la impone: su conveniencia se decide según dependencias, criticidad, costo de convivencia y horizonte de reemplazo."
      - "Solo se reutilizan los extractores liberados para ODP y técnicamente compatibles; el resto se moderniza. Definir el criterio de salida de la convivencia."
      - "Remite al árbol «Alcance de Modernización BW» (apéndice A02)."
    post_actions:
      mode: llm_value_add

  leaf_bw_whitelisted:
    decision: "Reutilización gobernada: continuar con los extractores/DataSources BW liberados para ODP (Nota SAP 2500202) como mecanismo de extracción hacia Datasphere."
    notes:
      - "Valor funcional vigente y compatibilidad técnica ya acreditados."
      - "Validar la capacidad delta del extractor y la semántica de los cambios que entrega, y cómo se persisten (ver módulo 03): que haya delta no garantiza la integridad del resultado."
    post_actions:
      mode: llm_value_add

  leaf_bw_valor_revision:
    decision: "Valor funcional no determinado: relevar antes de decidir reutilizar o modernizar."
    notes:
      - "Relevá el uso real, la criticidad y la semántica funcional reutilizable de los DataSources/extractores BW; apoyate en la Matriz Técnica del apéndice A02."
      - "Recién con el valor vigente establecido se decide entre reutilización gobernada y modernización del contrato; «No sé» no habilita por sí solo ninguna de las dos."
    post_actions:
      mode: needs_human_review
      reason: "Falta establecer el valor funcional vigente de los extractores BW"

  leaf_bw_compat_revision:
    decision: "Compatibilidad técnica no determinada: verificar antes de reutilizar."
    notes:
      - "Verificá la liberación/autorización para ODP (Nota SAP 2500202), la compatibilidad técnica con la integración prevista (conexión, versión, add-on DMIS, notas) y las condiciones de delta relevantes."
      - "La whitelist no garantiza integración ni delta; «No sé» no habilita reutilización ni modernización automática hasta acreditar la compatibilidad."
    post_actions:
      mode: needs_human_review
      reason: "Falta acreditar liberación ODP y compatibilidad técnica del extractor BW"

capture_uncharted:
  type: free_capture
  prompt: "Describí brevemente tu contexto técnico"
  fields:
    - id: context_description
      label: "¿Qué caracteriza tu caso?"
      required: true
    - id: decision_taken
      label: "¿Qué decidiste hacer?"
      required: false
    - id: outcome
      label: "¿Cómo resultó?"
      type: select
      options: ["anduvo", "no anduvo", "inconcluso", "en curso", "no lo sé"]
      required: true