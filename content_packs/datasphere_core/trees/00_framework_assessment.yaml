nodes:
  q_scope:
    type: single_choice
    question: ¿Qué tipo de diagnóstico querés realizar?
    help: 'Define si querés evaluar un módulo específico o usar el diagnóstico transversal. El transversal actúa como orquestador:
      conecta los diagnósticos modulares y ayuda a consolidar una mirada integral del proyecto.'
    options:
    - Diagnóstico transversal del Marco Metodológico
    - 'Diagnóstico específico: Arquitectura y Conectividad'
    - 'Diagnóstico específico: Seguridad y Gobernanza'
    - 'Diagnóstico específico: Integración y Estrategia'
    - 'Diagnóstico específico: Modelado y Desarrollo'
    - 'Diagnóstico específico: Reporting y Consumo'
    next:
      Diagnóstico transversal del Marco Metodológico: leaf_transversal
      'Diagnóstico específico: Arquitectura y Conectividad': leaf_m01
      'Diagnóstico específico: Seguridad y Gobernanza': leaf_m02
      'Diagnóstico específico: Integración y Estrategia': leaf_m03
      'Diagnóstico específico: Modelado y Desarrollo': leaf_m04
      'Diagnóstico específico: Reporting y Consumo': leaf_m05
    evaluation_guidance:
      Diagnóstico transversal: 'Usalo cuando quieras recorrer el proyecto end-to-end: landscape, gobierno, integración, modelado
        y consumo.'
      Arquitectura y Conectividad: Usalo para validar readiness del landscape, espacios, transportes, conectividad y restricciones
        técnicas.
      Seguridad y Gobernanza: Usalo para validar ownership, roles, privilegios, DAC, dominios y cross-sharing gobernado.
      Integración y Estrategia de Datos: Usalo para validar cómo ingresan los datos, contratos de integración, fuentes autorizadas
        y desacoplamiento.
      Modelado y Desarrollo: Usalo para validar capas, contratos semánticos, convenciones, semantic usage y técnica de modelado.
      Reporting y Consumo: Usalo para validar exposición, herramientas consumidoras, performance, seguridad de consumo y productos
        analíticos.
leaves:
  leaf_transversal:
    decision: Ejecutar diagnóstico transversal consolidando los assessments modulares.
    notes:
    - 'El transversal no duplica preguntas: orquesta los diagnósticos de cada módulo y consolida resultados con ponderación.'
    - El motor actual aún no encadena subárboles automáticamente; esta hoja deja preparado el contrato next_tree.
    next_tree_sequence:
    - m01_architecture_connectivity_assessment
    - m02_security_governance_assessment
    - m03_integration_strategy_assessment
    - m04_modeling_development_assessment
    - m05_reporting_consumption_assessment
    post_actions:
      mode: assessment_orchestration
      next_steps:
      - Ejecutar los cinco diagnósticos modulares.
      - Consolidar score por módulo usando transversal_weights.
      - Identificar brechas transversales y plan de remediación.
  leaf_m01:
