id: m04_flujos_de_datos
title: Flujos de Datos
version: "0.1"

# Links como navigation bindings (para UI / conexión con módulos)
links:
  module: 04_Modelado_y_Desarrollo
  topics: ["flujos_datos", "capas"]

# Tags taxonomy / Concepts (para búsqueda, agrupación, KG futuro)
tags: ["M04", "modeling", "flows", "replication-flow", "data-flow", "transformation-flow", "development"]

# Keywords en lenguaje natural para intent detection del asistente.
# Responde: ¿Cómo preguntaría un consultor sobre este árbol?
keywords: [
  "flujos de datos", "flujo de datos", "qué flujo usar", "que flujo usar",
  "replication flow", "data flow", "transformation flow",
  "diferencia replication flow data flow", "diferencia data flow transformation flow",
  "cuándo usar replication flow", "cuando usar replication flow",
  "cuándo usar data flow", "cuando usar data flow",
  "cuándo usar transformation flow", "cuando usar transformation flow",
  "carga delta", "captura delta", "delta capture",
  "replicar datos datasphere", "mover datos hacia HDLF", "materializar tabla local",
  "transformation flow vs data flow", "replication flow vs data flow",
  "árbol flujos de datos", "arbol flujos de datos", "qué flujo elegir", "que flujo elegir"
]

# exclude_if: palabras de intención operacional (el usuario quiere HACER algo, no DECIDIR)
exclude_if: [
  "codigo", "código", "template", "ejemplo", "ayudame con el codigo",
  "como hago", "como escribo", "escribir", "generar codigo", "crearme",
  "dame un", "mostrame", "sample", "snippet",
  "como nombro", "como se llama", "prefijo", "convención", "naming"
]

start: q1_delta

nodes:
  q1_delta:
    type: single_choice
    question: "¿Necesitás carga delta?"
    help: "Es decir, cargar solo los cambios después de la carga inicial."
    options: ["Sí", "No"]
    next:
      "Sí": q2_origen
      "No": q4_persistencia

  q2_origen:
    type: single_choice
    question: "¿Cuál es la fuente?"
    options: ["SAP/ABAP", "Datasphere", "Otra"]
    next:
      "SAP/ABAP": q2_b
      "Datasphere": leaf_transformation_flow_delta
      "Otra": q2c_conector

  q2_b:
    type: single_choice
    question: "¿La fuente SAP admite Replication Flow con carga delta?"
    help: "Por ejemplo, una CDS habilitada para extracción con delta (CDC o byElement), un extractor ODP (SAPI o BW) con delta o una tabla replicable con delta. Tener clave primaria no garantiza delta. Los objetos ODP sin clave declarada tienen condiciones propias, como configurar la clave a mano y restricciones de destino."
    options: ["Sí", "No", "No sé"]
    next:
      "Sí": q2_b2
      "No": leaf_revisar_extraccion_delta
      "No sé": leaf_revisar_extraccion_delta

  q2_b2:
    type: single_choice
    question: "¿La transformación va más allá de filtros, proyección y mapeo de columnas?"
    help: "Replication Flow resuelve filtros, proyección y mapeo de columnas. Joins, uniones, cálculos o lógica SQL necesitan otro artefacto."
    options: ["Sí", "No"]
    next:
      "Sí": q2_b3
      "No": leaf_replication_flow

  q2_b3:
    type: single_choice
    question: "¿La tabla que carga el Replication Flow puede alimentar un Transformation Flow incremental?"
    help: "Un Transformation Flow con Initial and Delta necesita origen y destino con Delta Capture. Que el Replication Flow cargue con delta no lo garantiza: verificá la tabla replicada. SAP documenta restricciones de destino para ciertos objetos ODP sin clave primaria declarada. Si la transformación tiene joins, revisá también cómo se propagan las actualizaciones y las eliminaciones."
    options: ["Sí, está verificado", "No", "No sé"]
    next:
      "Sí, está verificado": leaf_rf_mas_tf_delta
      "No": leaf_revision_rf_tf
      "No sé": leaf_revision_rf_tf

  q2c_conector:
    type: single_choice
    question: "¿Qué tipo de conexión es la fuente?"
    help: "Las opciones agrupan los conectores según la carga que soportan como origen."
    options:
      - "Amazon S3, Google Cloud Storage, Azure Data Lake Gen2, SFTP genérico, Microsoft OneLake, Snowflake, Local Table File — solo carga inicial (Initial Only) como fuente"
      - "Azure SQL Database, SQL Server, Oracle, SAP HANA (conexión externa) — carga inicial y delta completos (Initial Only / Initial and Delta / Delta Only)"
      - "Confluent, REST API — solo delta (Initial and Delta / Delta Only), sin carga inicial simple"
      - "SAP HANA Cloud, Data Lake Files (HDLFS directo) — fuente y destino, carga inicial y delta completos"
      - "Apache Kafka, Google BigQuery, SAP Signavio — no soportadas como fuente (solo como destino)"
    next:
      "Amazon S3, Google Cloud Storage, Azure Data Lake Gen2, SFTP genérico, Microsoft OneLake, Snowflake, Local Table File — solo carga inicial (Initial Only) como fuente": leaf_replication_flow_initial_only
      "Azure SQL Database, SQL Server, Oracle, SAP HANA (conexión externa) — carga inicial y delta completos (Initial Only / Initial and Delta / Delta Only)": leaf_replication_flow_full_delta_external
      "Confluent, REST API — solo delta (Initial and Delta / Delta Only), sin carga inicial simple": leaf_replication_flow_delta_only
      "SAP HANA Cloud, Data Lake Files (HDLFS directo) — fuente y destino, carga inicial y delta completos": leaf_replication_flow_hdlfs_native
      "Apache Kafka, Google BigQuery, SAP Signavio — no soportadas como fuente (solo como destino)": leaf_replication_flow_unsupported_source

  q4_persistencia:
    type: single_choice
    question: ¿Cómo necesitás disponer del resultado?
    help: 'Calcular al consultar evita una carga propia. Guardar en una tabla define una carga y su destino. Si solo
      buscás acelerar una vista existente, SAP permite persistir vistas SQL o gráficas: elegí Otra necesidad para
      revisar esa optimización antes de elegir un flujo.'
    options:
    - Calcular al consultar
    - Guardar en una tabla de HANA
    - Guardar en una tabla de File Space
    - Otra necesidad / no está definido
    next:
      Calcular al consultar: q5c_logica_virtual
      Guardar en una tabla de HANA: q5c_logica_hana
      Guardar en una tabla de File Space: q5c_logica_file
      Otra necesidad / no está definido: leaf_revision_sin_delta
  q5c_logica_virtual:
    type: single_choice
    question: ¿Qué procesamiento necesitás?
    help: 'Combinar tablas (joins), unir conjuntos, filtrar, calcular columnas y resumir datos son transformaciones
      declarativas: no exigen Data Flow. Elegí Python si existe una necesidad concreta de ejecutar ese código. Otra
      lógica procedural necesita caracterización antes de elegir herramienta.'
    options:
    - Combinar, filtrar, calcular o resumir datos
    - Ejecutar código Python
    - Otra lógica / no está caracterizada
    next:
      Combinar, filtrar, calcular o resumir datos: leaf_vista_sql
      Ejecutar código Python: q5c_confirmar_materializacion
      Otra lógica / no está caracterizada: leaf_revision_sin_delta
  q5c_logica_hana:
    type: single_choice
    question: ¿Qué procesamiento necesitás?
    help: 'Combinar tablas (joins), unir conjuntos, filtrar, calcular columnas y resumir datos son transformaciones
      declarativas: no exigen Data Flow. Elegí Python si existe una necesidad concreta de ejecutar ese código. Otra
      lógica procedural necesita caracterización antes de elegir herramienta.'
    options:
    - Combinar, filtrar, calcular o resumir datos
    - Ejecutar código Python
    - Otra lógica / no está caracterizada
    next:
      Combinar, filtrar, calcular o resumir datos: q5c_fuente_declarativo_hana
      Ejecutar código Python: q5c_fuente_python_hana
      Otra lógica / no está caracterizada: leaf_revision_sin_delta
  q5c_logica_file:
    type: single_choice
    question: ¿Qué procesamiento necesitás?
    help: 'Combinar tablas (joins), unir conjuntos, filtrar, calcular columnas y resumir datos son transformaciones
      declarativas: no exigen Data Flow. Elegí Python si existe una necesidad concreta de ejecutar ese código. Otra
      lógica procedural necesita caracterización antes de elegir herramienta.'
    options:
    - Combinar, filtrar, calcular o resumir datos
    - Ejecutar código Python
    - Otra lógica / no está caracterizada
    next:
      Combinar, filtrar, calcular o resumir datos: q5c_fuente_declarativo_file
      Ejecutar código Python: q5c_fuente_python_file
      Otra lógica / no está caracterizada: leaf_revision_sin_delta
  q5c_confirmar_materializacion:
    type: single_choice
    question: Python requiere guardar el resultado. ¿Aceptás cambiar tu elección inicial?
    help: Dentro de las alternativas de este árbol, Python se ejecuta en un flujo que materializa el resultado. Continuar
      abandona el procesamiento virtual elegido inicialmente. HANA utiliza Data Flow; File Space utiliza Transformation
      Flow con Python/Spark, sujeto a sus fuentes y restricciones.
    options:
    - Sí, guardar en HANA
    - Sí, guardar en File Space
    - Necesito mantenerlo virtual
    next:
      Sí, guardar en HANA: q5c_fuente_python_hana
      Sí, guardar en File Space: q5c_fuente_python_file
      Necesito mantenerlo virtual: leaf_revision_sin_delta
  q5c_fuente_declarativo_hana:
    type: single_choice
    question: ¿Cómo están disponibles los datos?
    help: Elegí dónde están los datos que realmente leerá el flujo. En vistas, considerá también de dónde vienen sus
      datos. BW bridge incluye tablas compartidas y vistas sobre ellas. Si combinás familias de origen o conocés restricciones
      de acceso/DAC, usá la última opción. Las condiciones específicas se explican en el resultado.
    options:
    - Tablas locales del espacio
    - Vistas u objetos Open SQL sobre datos locales
    - Objetos compartidos desde BW bridge
    - Tablas remotas generales o vistas sobre ellas
    - Datos aún en un sistema externo
    - Origen mixto, desconocido o con una restricción conocida
    next:
      Tablas locales del espacio: leaf_transformation_flow_simple
      Vistas u objetos Open SQL sobre datos locales: leaf_transformation_flow_simple
      Objetos compartidos desde BW bridge: leaf_transformation_flow_simple
      Tablas remotas generales o vistas sobre ellas: q5c_adquisicion_separada
      Datos aún en un sistema externo: q5c_conexion_declarativo_hana
      Origen mixto, desconocido o con una restricción conocida: leaf_revision_sin_delta
  q5c_fuente_declarativo_file:
    type: single_choice
    question: ¿Cómo están disponibles los datos?
    help: File Space ejecuta TF en Spark. El caso directo de este recorrido usa tablas locales del espacio. Otros
      objetos necesitan revisar su disponibilidad específica; no se asume que las fuentes admitidas por HANA estén
      disponibles en File Space. Si el dato sigue remoto, podemos evaluar su adquisición.
    options:
    - Tablas locales del espacio
    - Vistas, Open SQL, BW bridge u otros objetos compartidos
    - Datos remotos que necesitan adquirirse primero
    - Datos aún en un sistema externo
    - Origen mixto, desconocido o con una restricción conocida
    next:
      Tablas locales del espacio: leaf_tf_declarativo_file
      Vistas, Open SQL, BW bridge u otros objetos compartidos: leaf_revision_sin_delta
      Datos remotos que necesitan adquirirse primero: q5c_conexion_declarativo_file
      Datos aún en un sistema externo: q5c_conexion_declarativo_file
      Origen mixto, desconocido o con una restricción conocida: leaf_revision_sin_delta
  q5c_fuente_python_hana:
    type: single_choice
    question: ¿Cómo están disponibles los datos?
    help: Elegí dónde están los datos que realmente leerá el flujo. En vistas, considerá también de dónde vienen sus
      datos. BW bridge incluye tablas compartidas y vistas sobre ellas. Si combinás familias de origen o conocés restricciones
      de acceso/DAC, usá la última opción. Las condiciones específicas se explican en el resultado.
    options:
    - Tablas locales del espacio
    - Vistas u objetos Open SQL sobre datos locales
    - Objetos compartidos desde BW bridge
    - Tablas remotas generales o vistas sobre ellas
    - Datos aún en un sistema externo
    - Origen mixto, desconocido o con una restricción conocida
    next:
      Tablas locales del espacio: leaf_data_flow_python
      Vistas u objetos Open SQL sobre datos locales: leaf_data_flow_python
      Objetos compartidos desde BW bridge: leaf_data_flow_python
      Tablas remotas generales o vistas sobre ellas: leaf_data_flow_python
      Datos aún en un sistema externo: leaf_revision_sin_delta
      Origen mixto, desconocido o con una restricción conocida: leaf_revision_sin_delta
  q5c_fuente_python_file:
    type: single_choice
    question: ¿Cómo están disponibles los datos?
