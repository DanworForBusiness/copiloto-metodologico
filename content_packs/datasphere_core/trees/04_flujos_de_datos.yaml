leaves:
  leaf_replication_flow:
    decision: "Replication Flow — compatibilidad delta nativa."
    notes:
      - "Fuentes soportadas: vistas CDS habilitadas para extracción, objetos ODP (BW/extractores), tablas con clave primaria."
      - "Transformación deliberadamente limitada: filtros, mapeo de columnas, proyección personalizada — sin joins ni SQL. Si hace falta transformar de verdad, no es el artefacto adecuado."
      - "No admite parámetros de entrada."
      - "También puede exportar hacia HDLF, pero vía una conexión externa dedicada (SAP HANA Cloud, Data Lake, Files — Parquet, con delta), no el storage del propio espacio."
    post_actions:
      mode: resolved
      next_steps:
        - "Ver Estrategia de Extracción y CDC en el módulo 03"
        - "Definir frecuencia de carga delta según el SLA real de consumo (no la dejes por default)"

  leaf_rf_mas_tf_delta:
    decision: "Replication Flow para adquirir y Transformation Flow incremental para transformar."
    detail: "Referencias SAP: [Transformation Flow](https://help.sap.com/docs/SAP_DATASPHERE/c8a54ee704e94e15926551293243fd1d/f7161e6c20204672ac4a6d90c81762e4.html) · [Delta Capture](https://help.sap.com/docs/SAP_DATASPHERE/c8a54ee704e94e15926551293243fd1d/154bdffb35814d5481d1f6de143a6b9e.html)"
    notes:
      - "Se verificó que la tabla replicada sirve como fuente incremental y que el destino del Transformation Flow tiene Delta Capture."
      - "El Transformation Flow necesita Delta Capture en origen y destino, y no carga delta desde vistas."
      - "Delta Capture no garantiza por sí solo que toda transformación quede correcta: si hay joins, validá que se propaguen las actualizaciones y las eliminaciones (ver los límites del Transformation Flow en el módulo 04)."
    post_actions:
      mode: resolved
      next_steps:
        - "Cargar con Replication Flow la tabla local con delta"
        - "Confirmar Delta Capture en el origen y el destino del Transformation Flow"
        - "Si hay joins, probar la propagación de actualizaciones y eliminaciones antes de productivo"

  leaf_revision_rf_tf:
    decision: "Revisar la compatibilidad antes de encadenar Replication Flow y Transformation Flow."
    notes:
      - "Sin compatibilidad acreditada de la tabla replicada con Delta Capture, no se puede recomendar un Transformation Flow incremental."
      - "No reemplaces el delta con un Data Flow: no soporta carga delta."
      - "Validá la tabla replicada con la documentación de SAP y una prueba técnica, en especial con objetos ODP sin clave declarada."
    post_actions:
      mode: needs_human_review
      reason: "Compatibilidad de la tabla replicada con Delta Capture no acreditada — validar antes de encadenar Replication Flow y Transformation Flow incremental"

  leaf_revisar_extraccion_delta:
    decision: "Definí primero cómo extraer el dato con delta."
    detail: "Referencia SAP: [Fuentes ABAP para Replication Flows](https://help.sap.com/docs/SAP_DATASPHERE/c8a54ee704e94e15926551293243fd1d/3f70579c92434f4f88471bba2bd70893.html)"
    notes:
      - "Sin una fuente SAP que admita Replication Flow con delta, no hay adquisición incremental por esta vía."
      - "Usá el árbol «Opciones de Extracción» del módulo 03 para definir la fuente autorizada."
      - "No compenses la falta de delta con un Data Flow."
    post_actions:
      mode: needs_human_review
      reason: "Fuente SAP sin compatibilidad delta acreditada — definir la estrategia de extracción antes del flujo"

  leaf_replication_flow_initial_only:
    decision: "Replication Flow — pero desde esta fuente solo carga inicial (Initial Only), sin delta."
    notes:
      - "Amazon S3, Google Cloud Storage, Azure Data Lake Gen2, SFTP genérico, Microsoft OneLake, Snowflake y Local Table File soportan Replication Flow como fuente, pero únicamente en modo Initial Only."
      - "Si necesitás delta real desde uno de estos orígenes, no es alcanzable con Replication Flow — revisar si el sistema que alimenta ese storage (ej. la base de datos detrás de un data lake) tiene su propio conector con soporte Initial and Delta / Delta Only."
    post_actions:
      mode: resolved
      next_steps:
        - "Confirmar que una recarga completa periódica (Initial Only) es aceptable para el caso de uso"

  leaf_replication_flow_full_delta_external:
    decision: "Replication Flow — fuente con soporte completo: Initial Only, Initial and Delta y Delta Only."
    notes:
      - "Azure SQL Database, SQL Server, Oracle y SAP HANA (como conexión externa, no la del propio espacio) soportan los tres modos de carga como fuente."
      - "Elegir el modo según el caso: Initial Only para una copia puntual, Initial and Delta para mantener sincronizado, Delta Only si el histórico ya se cargó por otro medio."
    post_actions:
      mode: resolved

  leaf_replication_flow_delta_only:
    decision: "Replication Flow — esta fuente solo soporta delta (Initial and Delta / Delta Only), sin carga inicial simple."
    notes:
      - "Confluent y REST API no ofrecen el modo Initial Only, por su naturaleza de streaming/API — el primer registro ya llega como parte del flujo delta."
      - "Definir bien el modo (Initial and Delta vs. Delta Only) según si necesitás un snapshot inicial del histórico o solo los cambios desde ahora."
    post_actions:
      mode: resolved

  leaf_replication_flow_hdlfs_native:
    decision: "Replication Flow — SAP HANA Cloud, Data Lake Files (HDLFS) como conexión dedicada: soporte completo de fuente y destino."
    notes:
      - "Es el único conector con Initial Only / Initial and Delta / Delta Only en AMBAS columnas (fuente y destino) — permite replicar entre artefactos del object store sin pasar por HANA."
      - "Distinto de 'SAP Datasphere (file space)': esa conexión (el HDLF del propio espacio) solo puede usarse como DESTINO, nunca como fuente. Para leer desde HDLFS hace falta la conexión dedicada 'SAP HANA Cloud, Data Lake Files' — host, root path y autenticación por keystore propios, no la del espacio."
      - "Formato de intercambio: Parquet."
    post_actions:
      mode: resolved
      next_steps:
        - "Crear la conexión dedicada 'SAP HANA Cloud, Data Lake Files' (no reusar la conexión implícita del espacio) para poder leerla como fuente"

  leaf_replication_flow_unsupported_source:
    decision: "Replication Flow no aplica desde esta fuente — Apache Kafka, Google BigQuery y SAP Signavio no están soportados como origen, solo como destino."
    notes:
      - "Con estos conectores, Replication Flow solo puede usarlos como DESTINO — nunca como fuente de la que leer."
      - "Si el dato ya está en uno de estos sistemas y necesitás traerlo, buscar el origen real de ese dato (por ejemplo, el sistema que publica hacia el tópico de Kafka), no el conector intermedio."
    post_actions:
      mode: needs_human_review
      reason: "El conector elegido no soporta uso como fuente — replantear de dónde viene realmente el dato antes de definir el flujo."

  leaf_transformation_flow_delta:
    decision: "Transformation Flow — la fuente ya está en Datasphere y necesitás delta incremental."
    notes:
      - "Requiere Captura Delta habilitada tanto en la tabla origen como en la tabla destino."
      - "No soporta carga delta desde vistas — solo desde tablas con Captura Delta activa."
      - "Definir la transformación con Vista Gráfica o Vista SQL — la Vista SQL es más mantenible y versionable."
    post_actions:
      mode: resolved
      next_steps:
        - "Confirmar Captura Delta activa en origen y destino antes de desplegar"

  leaf_vista_sql:
    decision: Vista SQL — resolver la transformación al consultar.
    notes:
    - Joins, uniones, filtros, cálculos y agregaciones no requieren por sí solos un flujo de datos.
    - Aplica si las fuentes son consultables por la vista y la lógica es declarativa. Una restricción conocida de
      fuentes o acceso puede exigir otra arquitectura.
    - Si solo necesitás acelerar una vista existente, evaluá su persistencia con sus restricciones; guardar una tabla
      mediante un flujo es una decisión diferente.
    post_actions:
      mode: resolved
      next_steps:
      - Abrir el árbol 'Tipos de Vistas SQL' para evaluar tu escenario y elegir el tipo de vista
  leaf_transformation_flow_simple:
    decision: Transformation Flow — transformación declarativa hacia una tabla local HANA.
    notes:
    - Preferencia metodológica cuando las fuentes son admitidas. Puede definirse con transformación SQL o gráfica.
    - 'Admite tablas locales, vistas y objetos Open SQL admitidos, y tablas BW bridge compartidas o vistas sobre ellas.
      Las vistas/Open SQL con remotas generales, DAC aplicado o dependencias con DAC tienen restricciones: no continuar
      por esta vía si se conocen esas condiciones.'
    - 'Carga sin delta. Pasar a incremental requiere revisar el origen y la transformación: no basta activar Delta
      Capture; no hay delta desde vistas.'
    post_actions:
      mode: resolved
  leaf_tf_declarativo_file:
    decision: Transformation Flow — transformación declarativa hacia una tabla local de File Space.
    notes:
    - Runtime Spark y fuentes locales admitidas en el espacio de archivos. No extrapolar la compatibilidad de fuentes
      HANA.
    - Definir la transformación y cargar sin delta. Ante restricciones del objeto o dependencias no cubiertas, revisar
      la arquitectura.
    post_actions:
      mode: resolved
  leaf_tf_python_file:
    decision: Transformation Flow Python/Spark — guardar el resultado en File Space.
    notes:
    - Python se ejecuta en Spark sobre las fuentes locales admitidas; el resultado se materializa en una tabla local
      de archivos.
    - No sustituye Python en HANA. Verificar bibliotecas y tipos soportados; el operador Python de Spark no admite
      los parámetros de entrada definidos en TF.
    - Data Flow no es una alternativa para escribir en File Space.
    post_actions:
      mode: resolved
  leaf_data_flow_python:
    decision: Data Flow — ejecutar Python y guardar en una tabla local HANA.
    notes:
    - 'Recomendación metodológica condicionada: orienta la elección del flujo, pero no certifica la compatibilidad
      de un objeto concreto. Antes de implementarla, comprobá sus condiciones de aplicabilidad.'
    - Aplica si los objetos están disponibles y admitidos en el navegador de fuentes del Data Flow y el procesamiento
      requerido está soportado. Una restricción conocida exige revisión.
    - No soporta carga delta ni destinos File Space. Si aparece un requisito incremental, retomar la rama delta y
      revisar la transformación.
    - La complejidad de la transformación no justifica por sí sola agregar una adquisición separada.
    post_actions:
      mode: llm_value_add
  leaf_data_flow_directo:
    decision: Data Flow directo — transformar fuentes remotas y guardar en HANA.
    notes:
    - 'Recomendación metodológica condicionada: orienta la elección del flujo, pero no certifica la compatibilidad
      de un objeto concreto. Antes de implementarla, comprobá sus condiciones de aplicabilidad.'
    - Aplica si los objetos están disponibles y admitidos en el navegador de fuentes del Data Flow y el procesamiento
      requerido está soportado. Una restricción conocida exige revisión.
    - No soporta carga delta ni destinos File Space. Si aparece un requisito incremental, retomar la rama delta y
      revisar la transformación.
    - La complejidad de la transformación no justifica por sí sola agregar una adquisición separada.
    post_actions:
      mode: llm_value_add
  leaf_rf_tf_declarativo_hana:
    decision: Replication Flow Initial Only + Transformation Flow declarativo/HANA — destino tabla local HANA.
    notes:
    - 'Recomendación metodológica condicionada: orienta la elección del flujo, pero no certifica la compatibilidad
      de un objeto concreto. Antes de implementarla, comprobá sus condiciones de aplicabilidad.'
    - RF adquiere hacia una tabla local consumible por el TF del espacio elegido; TF realiza el procesamiento y escribe
      el resultado. No se trata de TF incremental.
    - Recomendación condicionada a que el objeto, los tipos y el destino estén admitidos por el conector RF y a que
      la tabla de llegada sea utilizable por este TF. Si hay una restricción conocida, revisar antes de ejecutar.
    - La separación se justifica por adquisición necesaria, reutilización o recuperación de esa adquisición; no promete
      recuperación del TF ni de toda la cadena.
    - Si el requerimiento cambia a Python, volver a elegir procesamiento y destino.
    post_actions:
      mode: resolved
  leaf_rf_tf_declarativo_file:
    decision: Replication Flow Initial Only + Transformation Flow declarativo/Spark — destino tabla local de File
      Space.
    notes:
    - 'Recomendación metodológica condicionada: orienta la elección del flujo, pero no certifica la compatibilidad
      de un objeto concreto. Antes de implementarla, comprobá sus condiciones de aplicabilidad.'
    - RF adquiere hacia una tabla local consumible por el TF del espacio elegido; TF realiza el procesamiento y escribe
      el resultado. No se trata de TF incremental.
    - Recomendación condicionada a que el objeto, los tipos y el destino estén admitidos por el conector RF y a que
      la tabla de llegada sea utilizable por este TF. Si hay una restricción conocida, revisar antes de ejecutar.
    - La separación se justifica por adquisición necesaria, reutilización o recuperación de esa adquisición; no promete
      recuperación del TF ni de toda la cadena.
    - Si el requerimiento cambia a Python, volver a elegir procesamiento y destino.
    post_actions:
      mode: resolved
  leaf_rf_tf_python_file:
    decision: Replication Flow Initial Only + Transformation Flow Python/Spark — destino tabla local de File Space.
    notes:
    - 'Recomendación metodológica condicionada: orienta la elección del flujo, pero no certifica la compatibilidad
      de un objeto concreto. Antes de implementarla, comprobá sus condiciones de aplicabilidad.'
    - RF adquiere hacia una tabla local consumible por el TF del espacio elegido; TF realiza el procesamiento y escribe
      el resultado. No se trata de TF incremental.
    - Recomendación condicionada a que el objeto, los tipos y el destino estén admitidos por el conector RF y a que
      la tabla de llegada sea utilizable por este TF. Si hay una restricción conocida, revisar antes de ejecutar.
    - La separación se justifica por adquisición necesaria, reutilización o recuperación de esa adquisición; no promete
      recuperación del TF ni de toda la cadena.
    - No representa una solución para ejecutar Python en HANA.
    post_actions:
      mode: resolved
  leaf_revision_sin_delta:
    decision: Revisión metodológica — precisar el caso antes de elegir un artefacto.
    notes:
    - 'El historial conserva el motivo: lógica no caracterizada, destino, persistencia de una vista por rendimiento,
      necesidad de mantener virtualidad, fuente o adquisición no cubierta.'
    - Si se llegó desde File Space con vistas, Open SQL o BW bridge, revisar las capacidades específicas del entorno
      antes de recomendar TF o adquirir una copia.
    - 'Para Python/HANA, RF + TF no es una solución equivalente: TF no ejecuta Python en runtime HANA.'
    - Aclarar únicamente la condición que bloquea la elección; no convertir el caso en una auditoría completa.
    post_actions:
      mode: needs_human_review
      reason: El recorrido identifica una necesidad o condición fuera de las alternativas acreditadas; revisar el
        historial antes de elegir herramienta.

capture_uncharted:
  type: free_capture
  prompt: "Describí brevemente tu caso de movimiento/transformación de datos"
  fields:
    - id: context_description
      label: "¿Qué necesitás resolver con el flujo?"
      required: true
    - id: decision_taken
      label: "¿Qué flujo elegiste?"
      required: false
    - id: outcome
      label: "¿Cómo resultó?"
      type: select
      options: ["anduvo", "no anduvo", "inconcluso", "en curso", "no lo sé"]
      required: true
