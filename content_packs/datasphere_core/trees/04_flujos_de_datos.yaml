    - Origen mixto, desconocido o con una restricción conocida
    next:
      Tablas locales del espacio: leaf_tf_python_file
      Vistas, Open SQL, BW bridge u otros objetos compartidos: leaf_revision_sin_delta
      Datos remotos que necesitan adquirirse primero: q5c_conexion_python_file
      Datos aún en un sistema externo: q5c_conexion_python_file
      Origen mixto, desconocido o con una restricción conocida: leaf_revision_sin_delta
  q5c_adquisicion_separada:
    type: single_choice
    question: ¿Necesitás una copia de origen separada de la transformación?
    help: Una copia separada puede servir para reutilizar los datos o recuperar la adquisición independientemente.
      Si Data Flow directo resuelve el caso, sin esas necesidades, no hace falta agregar RF + TF. La recuperación
      de RF no garantiza la recuperación de toda la cadena.
    options:
    - No, alcanza con transformar y cargar directamente
    - Sí, por reutilización o recuperación de la adquisición
    - No está definido
    next:
      No, alcanza con transformar y cargar directamente: leaf_data_flow_directo
      Sí, por reutilización o recuperación de la adquisición: q5c_conexion_declarativo_hana
      No está definido: leaf_revision_sin_delta
  q5c_conexion_declarativo_hana:
    type: single_choice
    question: ¿Qué conexión de origen vas a utilizar?
    help: 'El contexto de procesamiento y destino se conserva. Esta ruta evalúa RF Initial Only: no promete delta.
      Se recomienda la cadena solo para objetos y tipos admitidos por el conector y por la tabla de llegada. SAP/ABAP,
      conexiones no identificadas y restricciones conocidas requieren revisar el objeto concreto. En File Space la
      llegada debe ser una tabla local de archivos consumible por TF/Spark.'
    options:
    - Azure SQL Database, SQL Server, Oracle o SAP HANA externo
    - Amazon S3, Google Cloud Storage, Azure Data Lake Gen2, SFTP o Snowflake
    - SAP/ABAP, otro conector o restricciones del objeto
    - No sé qué conexión u objeto se utilizará
    next:
      Azure SQL Database, SQL Server, Oracle o SAP HANA externo: leaf_rf_tf_declarativo_hana
      Amazon S3, Google Cloud Storage, Azure Data Lake Gen2, SFTP o Snowflake: leaf_rf_tf_declarativo_hana
      SAP/ABAP, otro conector o restricciones del objeto: leaf_revision_sin_delta
      No sé qué conexión u objeto se utilizará: leaf_revision_sin_delta
